<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giełda – gra</title>
<style>
:root{--bg:#0a1c24;--p:#10303d;--p2:#0d2630;--l:#1f4656;--t:#e8f1f4;--m:#85a3ae;--g:#3ddc97;--r:#ff5d6c;--a:#f5b942}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
#news{display:flex;align-items:stretch;background:#b3162a;color:#fff;height:46px;overflow:hidden;border-bottom:3px solid var(--a)}
#news b{background:#fff;color:#b3162a;padding:0 16px;display:flex;align-items:center;font-size:15px;letter-spacing:.04em;white-space:nowrap}
#news.flash b{animation:bl .7s steps(2) 6}
@keyframes bl{50%{background:var(--a);color:#000}}
.mq{flex:1;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.mq span{display:inline-block;padding-left:100%;animation:mq 70s linear infinite;font-size:16px}
@keyframes mq{to{transform:translateX(-100%)}}
header{display:flex;gap:16px;align-items:center;padding:12px 18px;flex-wrap:wrap}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;flex:1}
#cd{width:150px;color:var(--m);font-size:12px}
#cd i{display:block;height:4px;background:var(--a);margin-top:4px;border-radius:2px;transition:width .5s linear}
main{display:grid;grid-template-columns:270px 1fr 300px;gap:14px;padding:0 18px 24px}
@media(max-width:1000px){main{grid-template-columns:1fr}#list{max-height:300px}}
.card{background:var(--p);border-radius:10px;padding:14px}
.card h3{margin:0 0 8px;font-size:15px}
#list{padding:6px 0 0;max-height:590px;overflow:auto}.lw{padding:8px}
#srch{width:100%;padding:10px;border-radius:6px;border:1px solid var(--l);background:var(--p2);color:var(--t);font:inherit}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:6px;padding:7px 8px;border-radius:6px;cursor:pointer;align-items:center}
.row:hover{background:var(--p2)}.row.on{background:var(--l)}
.row small{display:block;color:var(--m);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pr{text-align:right}.up{color:var(--g)}.dn{color:var(--r)}
#hd{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
#hd h2{margin:0;font-size:24px}#hd .big{font-size:28px;font-weight:700}
canvas{width:100%;height:320px;display:block;margin:10px 0}
.trade{display:flex;gap:8px;flex-wrap:wrap}
.trade input{width:110px;padding:10px;border-radius:6px;border:1px solid var(--l);background:var(--p2);color:var(--t);font:inherit}
button{padding:10px 18px;border:0;border-radius:6px;font:inherit;font-weight:600;cursor:pointer;color:#04140c}
button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#buy{background:var(--g)}#sell{background:var(--r);color:#fff}#mx{background:var(--l);color:var(--t)}
#msg{min-height:20px;margin-top:8px;color:var(--a)}
.kv{display:flex;justify-content:space-between;padding:3px 0}
.kv.tot{border-top:1px solid var(--l);margin-top:6px;padding-top:8px;font-weight:700;font-size:16px}
#pf+.card{margin-top:14px}
ol{margin:0;padding-left:22px}ol li{padding:3px 0}ol li.me{color:var(--a);font-weight:700}
ol li span{float:right}
.note{color:var(--m);font-size:12px;margin-top:8px}
#con{position:fixed;left:0;right:0;bottom:0;height:42vh;background:#050d11f2;border-top:2px solid var(--a);font:13px/1.5 ui-monospace,Consolas,monospace;display:none;flex-direction:column;z-index:50}
#con.open{display:flex}#cout{flex:1;overflow:auto;padding:10px 14px;white-space:pre-wrap}
.cl{display:flex;gap:8px;padding:8px 14px;border-top:1px solid var(--l)}.cl span{color:var(--a)}
#cin{flex:1;background:none;border:0;color:var(--t);font:inherit;outline:0}
</style>
</head>
<body>
<div id="news"><b>NA ŻYWO</b><div class="mq"><span id="mqt">Oczekiwanie na wiadomości…</span></div></div>
<header><h1>Giełda</h1><span id="who"></span><div id="cd"><span id="cds">10 s</span><i id="bar"></i></div></header>
<main>
  <section class="card lw"><input id="srch" type="search" placeholder="Szukaj spółki lub symbolu…" aria-label="Szukaj spółki"><div id="list"></div></section>
  <section class="card">
    <div id="hd"></div>
    <canvas id="cv"></canvas>
    <div class="trade">
      <input id="q" type="number" min="1" step="1" value="1" aria-label="Liczba akcji">
      <button id="buy">Kup</button><button id="sell">Sprzedaj</button><button id="mx">Maks.</button>
    </div>
    <div id="msg" role="status"></div>
  </section>
  <aside>
    <div class="card" id="pf"></div>
    <div class="card"><h3>Ranking graczy</h3><ol id="lb"></ol><div class="note" id="lbn"></div></div>
  </aside>
</main>

<div id="con" role="dialog" aria-label="Konsola admina"><div id="cout"></div><div class="cl"><span>&gt;</span><input id="cin" autocomplete="off" spellcheck="false" placeholder="help"></div></div>
<script type="module">

const START_CASH = 100000, TICK_MS = 10000;

/* ================= SPÓŁKI (fikcyjne) ================= */
const C = `ORB|Orbita Kosmos|142
NVT|Novatech Systems|310
BLS|Błękitna Stal|58

/* ================= RYNEK DETERMINISTYCZNY =================
   Ceny i zdarzenia wynikają wyłącznie z numeru "ticku" (czas/10 s) – każdy gracz widzi to samo,
   bez serwera symulującego rynek i bez kosztów zapisów do bazy. */
function h(a,b){let x=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263))|0;x=Math.imul(x^(x>>>13),1274126177);x^=x>>>16;return(x>>>0)/4294967296}
const TPL=[].concat([
["{n} ogłasza rekordowe zyski kwartalne",.14],
["{n} podpisuje wielki kontrakt z zagranicznym partnerem",.13],
["Prezes {n} zapowiada rewolucyjny produkt",.12],
["Analitycy podnoszą rekomendację dla {n} do „kupuj”",.09],
["{n} przejmuje konkurenta za miliardy",.11],
["Rząd ogłasza dotacje – {n} największym beneficjentem",.10],
["{n} zapowiada skup akcji własnych",.09],
["{n} wypłaci rekordową dywidendę",.08],
["{n} wchodzi na rynki azjatyckie",.10],
["{n} wygrywa przetarg na ogromny kontrakt państwowy",.13],
["Duży fundusz inwestycyjny kupuje pakiet akcji {n}",.09],
["{n} prezentuje przełomową technologię",.15],
["{n} podnosi prognozy wyników na cały rok",.10],
["Nagroda branżowa i fala świetnych recenzji dla {n}",.07],
["{n} zawiera partnerstwo z globalnym gigantem",.12],
["Sąd oddala pozew przeciwko {n}",.08],
["{n} tnie koszty – marże rosną szybciej niż oczekiwano",.09],
["Spekulacje o przejęciu {n} przez zagraniczny koncern",.14],
["{n} odkrywa nowe złoża i zwiększa zasoby",.11],
["Fala zamówień zaskakuje zarząd {n}",.12],
["{n} spłaca zadłużenie wcześniej niż planowano",.08],
["Nowy prezes {n} przedstawia ambitną strategię",.09],
["{n} uzyskuje kluczowy patent",.11],
["Rekordowa sprzedaż w sezonie dla {n}",.10]],
[
["{n}: afera księgowa, prokuratura wszczyna śledztwo",-.17],
["Pożar w fabryce {n} wstrzymuje produkcję",-.13],
["Prezes {n} niespodziewanie rezygnuje",-.11],
["{n} ukarana rekordową grzywną przez regulatora",-.12],
["Atak hakerski na systemy {n}, wyciek danych klientów",-.14],
["Strajk pracowników {n} paraliżuje spółkę",-.10],
["{n} ostrzega przed słabszymi wynikami w kolejnym kwartale",-.12],
["Analitycy obniżają rekomendację dla {n} do „sprzedaj”",-.09],
["{n} wycofuje wadliwy produkt z rynku",-.13],
["Duży akcjonariusz wyprzedaje akcje {n}",-.10],
["{n} przegrywa spór sądowy – grozi odszkodowanie",-.14],
["Awaria systemów {n} – klienci bez usług od wielu godzin",-.09],
["{n} traci głównego kontrahenta",-.12],
["Nieudana emisja akcji {n} rozwodni udziały",-.11],
["Kontrola skarbowa w siedzibie {n}",-.10],
["{n} opóźnia premierę flagowego produktu",-.10],
["Zakłócenia w łańcuchu dostaw uderzają w {n}",-.09],
["Konkurent {n} prezentuje tańszą i lepszą ofertę",-.08],
["Agencja obniża rating spółki {n}",-.12],
["{n} przyznaje się do zawyżania wyników",-.18],
["Burza wokół wypowiedzi prezesa {n} – klienci bojkotują markę",-.11],
["Zaskakująca strata kwartalna w {n}",-.13],
["Zerwane negocjacje {n} z kluczowym partnerem",-.10],
["{n} oskarżona o skażenie środowiska",-.15]]);
const TG=[
["Bank centralny obniża stopy procentowe – giełda w górę",.05],
["Rząd ogłasza pakiet stymulacyjny dla gospodarki",.06],
["Dane o PKB lepsze od prognoz – optymizm na parkiecie",.04],
["Inflacja niższa od oczekiwań, inwestorzy odetchnęli",.04],
["Rekordowy napływ kapitału zagranicznego na giełdę",.05],
["Bank centralny podnosi stopy – inwestorzy wyprzedają akcje",-.05],
["Wstrząs na rynkach światowych – panika na parkiecie",-.07],
["Rosnące bezrobocie studzi nastroje inwestorów",-.04],
["Nowe cła w handlu międzynarodowym uderzają w spółki",-.05],
["Kryzys polityczny – inwestorzy uciekają do bezpiecznych aktywów",-.06]];
let cfg={r:[],f:[]};
const rateAt=s=>{let v=.22;for(const x of cfg.r)if(x.a<=s)v=x.v;return v};
const evC=new Map();
function ev(s){if(evC.has(s))return evC.get(s);let e=null;
  const fe=cfg.f.find(x=>x.s===s);
  if(fe)e=fe;else if(h(s,7777)<rateAt(s)){/* domyślnie ok. 1 zdarzenie na 45 s */
    if(h(s,4)<.15){const k=Math.floor(h(s,2)*TG.length);e={s,i:-1,k,m:TG[k][1]*(.6+.8*h(s,3))}}
    else{const k=Math.floor(h(s,2)*TPL.length);e={s,i:Math.floor(h(s,1)*C.length),k,m:TPL[k][1]*(.6+.8*h(s,3))}}}
  evC.set(s,e);return e}
function price(i,t){const c=C[i];let lp=.10*c.v*Math.sin(t*.0175+c.p[0])+.16*c.v*Math.sin(t*.0031+c.p[1])+.22*c.v*Math.sin(t*.0007+c.p[2])+(h(t,i)-.5)*.03*c.v;
  for(let s=t-40;s<=t;s++){const e=ev(s);if(e&&(e.i===i||e.i<0))lp+=e.m*Math.exp(-(t-s)/10)}
  return Math.max(1,c.b*Math.exp(lp))}
const tick=()=>Math.floor(Date.now()/TICK_MS);
const headline=e=>e.i<0?TG[e.k][0]:TPL[e.k][0].replace("{n}",C[e.i].n);

/* ================= GRACZ + FIREBASE ================= */
const $=id=>document.getElementById(id);
const money=n=>n.toLocaleString("pl-PL",{minimumFractionDigits:2,maximumFractionDigits:2})+" zł";
let db=null,fs=null,uid="local",P={name:"",c:START_CASH,h:{}};
const online=!FIREBASE_CONFIG.apiKey.includes("WKLEJ");

async function init(){
  if(online){
    try{
      const v="10.12.2",b=`https://www.gstatic.com/firebasejs/${v}/`;
      const [A,Au,F]=await Promise.all([import(b+"firebase-app.js"),import(b+"firebase-auth.js"),import(b+"firebase-firestore.js")]);
      const app=A.initializeApp(FIREBASE_CONFIG),auth=Au.getAuth(app);
      uid=(await Au.signInAnonymously(auth)).user.uid;db=F.getFirestore(app);fs=F;
      const snap=await F.getDoc(F.doc(db,"players",uid));
      if(snap.exists())P=snap.data();
    }catch(e){console.error(e);$("lbn").textContent="Błąd Firebase – gra działa lokalnie.";db=null}
  }
  if(!db){try{P=JSON.parse(localStorage.getItem("gielda")||"null")||P}catch(e){}}
  if(!P.name){P.name=(prompt("Wybierz nick do rankingu (maks. 20 znaków):")||"Gracz"+Math.floor(Math.random()*1000)).slice(0,20);await save()}
  $("who").textContent=P.name;
  if(db){
    fs.onSnapshot(fs.doc(db,"config","market"),d=>{if(d.exists()){cfg=Object.assign({r:[],f:[]},d.data());evC.clear();lastEv=-1;if(lastT)refresh()}});
    fs.onSnapshot(fs.doc(db,"players",uid),d=>{if(d.metadata.hasPendingWrites||d.metadata.fromCache)return;
      if(!d.exists()){P={name:P.name,c:START_CASH,h:{}};save()}
      else{const x=d.data();if((x.ts||0)>(P.ts||0)+1){P=x;if(lastT){chart();portfolio()}}}});
  }else{try{cfg=Object.assign({r:[],f:[]},JSON.parse(localStorage.getItem("gielda_cfg")||"{}"))}catch(e){}}
  refresh();setInterval(loop,500);loadLb();setInterval(loadLb,30000);
}
const worth=()=>P.c+Object.entries(P.h).reduce((s,[k,q])=>s+q*(prices[k]||0),0);
let lastSave=0;
async function save(){
  P.worth=Math.round(worth()*100)/100;P.ts=Date.now();lastSave=P.ts;
  if(db)try{await fs.setDoc(fs.doc(db,"players",uid),{name:P.name,c:P.c,h:P.h,worth:P.worth||START_CASH,ts:P.ts})}catch(e){console.error(e)}
  else localStorage.setItem("gielda",JSON.stringify(P));
}
async function loadLb(){
  if(!db){$("lb").innerHTML=`<li class="me">${P.name}<span>${money(worth())}</span></li>`;$("lbn").textContent="Tryb lokalny – wklej konfigurację Firebase, aby włączyć ranking online.";return}
  try{
    const q=fs.query(fs.collection(db,"players"),fs.orderBy("worth","desc"),fs.limit(20));
    const s=await fs.getDocs(q);let html="";
    s.forEach(d=>{const x=d.data();html+=`<li class="${d.id===uid?"me":""}">${esc(x.name)}<span>${money(x.worth)}</span></li>`});
    $("lb").innerHTML=html;$("lbn").textContent="Wartość z ostatniej synchronizacji gracza.";
  }catch(e){console.error(e)}
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= INTERFEJS ================= */
let sel=0,t=tick(),lastT=0,lastEv=-1,prices={};
function loop(){
  const now=Date.now(),left=TICK_MS-(now%TICK_MS);
  $("cds").textContent=`Odświeżenie za ${Math.ceil(left/1000)} s`;$("bar").style.width=(left/TICK_MS*100)+"%";
  if(tick()!==lastT)refresh();
}
function refresh(){
  t=tick();lastT=t;
  C.forEach((c,i)=>prices[c.s]=price(i,t));
  list();chart();portfolio();news();
  if(db&&Date.now()-lastSave>60000)save();
}
function list(){
  const el=$("list");
  const qs=norm($("srch").value.trim());const rows=C.map((c,i)=>{if(qs&&!norm(c.s+" "+c.n).includes(qs))return"";const p=prices[c.s],o=price(i,t-60),d=(p/o-1)*100;
    return`<div class="row ${i===sel?"on":""}" data-i="${i}"><b>${c.s}</b><span><small>${c.n}</small></span><span class="pr">${p.toFixed(2)}<small class="${d>=0?"up":"dn"}">${d>=0?"+":""}${d.toFixed(1)}%</small></span></div>`}).join("");
  el.innerHTML=rows||'<div class="note" style="padding:8px">Brak spółek pasujących do wyszukiwania.</div>';
}
const norm=s=>s.toLowerCase().replace(/ł/g,"l").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
$("srch").addEventListener("input",list);
$("list").addEventListener("click",e=>{const r=e.target.closest(".row");if(r){sel=+r.dataset.i;list();chart();$("msg").textContent=""}});
function chart(){
  const c=C[sel],cv=$("cv"),d=devicePixelRatio||1,w=cv.clientWidth,H=cv.clientHeight,N=120;
  cv.width=w*d;cv.height=H*d;const x=cv.getContext("2d");x.scale(d,d);
  const ys=[];for(let k=N-1;k>=0;k--)ys.push(price(sel,t-k));
  const mn=Math.min(...ys),mx=Math.max(...ys),R=64,X=i=>i*(w-R)/(N-1),Y=v=>10+(H-24)*(1-(v-mn)/(mx-mn||1));
  const up=ys[N-1]>=ys[0],col=up?"#3ddc97":"#ff5d6c";
  x.font="11px system-ui";x.fillStyle="#85a3ae";x.strokeStyle="#1f4656";x.lineWidth=1;
  for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4,y=Y(v);x.beginPath();x.moveTo(0,y);x.lineTo(w-R,y);x.stroke();x.fillText(v.toFixed(2),w-R+8,y+4)}
  x.beginPath();ys.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));
  x.strokeStyle=col;x.lineWidth=2;x.stroke();
  x.lineTo(X(N-1),H-14);x.lineTo(0,H-14);const gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,col+"44");gr.addColorStop(1,col+"00");x.fillStyle=gr;x.fill();
  x.fillStyle="#85a3ae";x.fillText("−20 min",0,H-1);x.fillText("teraz",w-R-28,H-1);
  const p=ys[N-1],d10=(p/ys[N-61]-1)*100,own=P.h[c.s]||0;
  $("hd").innerHTML=`<div><h2>${c.s} <small style="font-weight:400;color:var(--m)">${c.n}</small></h2></div><div><span class="big">${money(p)}</span> <span class="${d10>=0?"up":"dn"}">${d10>=0?"+":""}${d10.toFixed(2)}% (10 min)</span><div class="note">Posiadasz: ${own} szt.</div></div>`;
}
function portfolio(){
  const hs=Object.entries(P.h).filter(([,q])=>q>0);
  const val=hs.reduce((s,[k,q])=>s+q*prices[k],0);
  $("pf").innerHTML=`<h3>Portfel – ${esc(P.name)}</h3><div class="kv"><span>Gotówka</span><span>${money(P.c)}</span></div><div class="kv"><span>Akcje</span><span>${money(val)}</span></div><div class="kv tot"><span>Razem</span><span>${money(P.c+val)}</span></div>`+
    (hs.length?`<div style="margin-top:10px">${hs.map(([k,q])=>`<div class="kv"><span>${k} × ${q}</span><span>${money(q*prices[k])}</span></div>`).join("")}</div>`:`<div class="note">Brak akcji – wybierz spółkę z listy i kup pierwsze.</div>`);
}
function news(){
  const list=[];for(let s=t;s>t-300&&list.length<8;s--){const e=ev(s);if(e)list.push(e)}
  if(!list.length)return;
  const top=list[0];
  if(top.s!==lastEv){lastEv=top.s;
    $("mqt").innerHTML=list.map(e=>{const tm=new Date(e.s*TICK_MS).toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});return`${e.m>0?"▲":"▼"} ${tm} ${esc(headline(e))}`}).join("&nbsp;&nbsp;&nbsp;◆&nbsp;&nbsp;&nbsp;");
  }
  $("news").classList.toggle("flash",t-top.s<=2);
}
async function trade(side){
  const q=Math.floor(+$("q").value),c=C[sel],p=price(sel,tick()),m=$("msg");
  if(!(q>0)){m.textContent="Podaj liczbę akcji większą od zera.";return}
  if(side==="b"){const cost=q*p;if(cost>P.c){m.textContent=`Za mało gotówki. Stać Cię na ${Math.floor(P.c/p)} szt.`;return}P.c-=cost;P.h[c.s]=(P.h[c.s]||0)+q;m.textContent=`Kupiono ${q} × ${c.s} po ${money(p)}.`}
  else{if((P.h[c.s]||0)<q){m.textContent=`Masz tylko ${P.h[c.s]||0} szt. ${c.s}.`;return}P.c+=q*p;P.h[c.s]-=q;if(!P.h[c.s])delete P.h[c.s];m.textContent=`Sprzedano ${q} × ${c.s} po ${money(p)}.`}
  prices[c.s]=p;chart();portfolio();await save();loadLb();
}
$("buy").onclick=()=>trade("b");$("sell").onclick=()=>trade("s");
$("mx").onclick=()=>{const p=price(sel,tick());$("q").value=Math.max(1,Math.floor(P.c/p))};
addEventListener("resize",chart);

/* ================= KONSOLA ADMINA (klawisz `) ================= */
const con=$("con"),out=$("cout"),cin=$("cin");let pend=null;
const say=m=>{const d=document.createElement("div");d.textContent=m;out.appendChild(d);out.scrollTop=out.scrollHeight};
addEventListener("keydown",e=>{
  if(e.code==="Backquote"){e.preventDefault();con.classList.toggle("open");if(con.classList.contains("open")){cin.focus();if(!out.children.length)say("Konsola admina. Wpisz help.")}}
  else if(e.key==="Escape")con.classList.remove("open")});
cin.addEventListener("keydown",async e=>{if(e.key!=="Enter")return;const l=cin.value.trim();cin.value="";if(!l)return;say("> "+l);try{await run(l)}catch(err){say("Błąd: "+err.message)}});
const isAdmin=()=>!online||(ADMIN_UID&&uid===ADMIN_UID);
const nrm=x=>norm(String(x||""));
const sgn=x=>x==="pos"?1:x==="neg"?-1:(Math.random()<.5?1:-1);
async function allPlayers(){const q=await fs.getDocs(fs.query(fs.collection(db,"players"),fs.limit(500)));return q.docs.map(d=>({id:d.id,...d.data()}))}
async function cfgSave(){
  if(db)await fs.setDoc(fs.doc(db,"config","market"),cfg);else localStorage.setItem("gielda_cfg",JSON.stringify(cfg));
  evC.clear();lastEv=-1;refresh()}
async function run(l){
  const a=l.split(/\s+/),c=a[0].toLowerCase();
  if(c!=="yes")pend=null;
  if(c==="uid"){say(uid);return}
  if(c==="help"){["events <sekundy|off>  – średni odstęp między zdarzeniami (min. 10), np. events 30","event <SYMBOL|market> [pos|neg]  – wymuś zdarzenie (za ok. 20 s)","status  – bieżące ustawienia","players  – lista graczy","del <fragment nicku|*>  – usuń konta (potem potwierdź: yes)","reset <nick>  – wyzeruj konto do kapitału startowego","give <nick> <kwota>  – dodaj/odejmij gotówkę","uid  – pokaż swoje UID"].forEach(say);return}
  if(!isAdmin()){say("Brak uprawnień. Twoje UID: "+uid);say("Wklej je do ADMIN_UID w pliku oraz do reguł Firestore.");return}
  const needDb=()=>{if(!db){say("Ta komenda wymaga połączenia z Firebase.");return true}};
  if(c==="status"){const r=rateAt(tick());say(`Tick ${tick()} | zdarzenia: ${r?"co ok. "+Math.round(10/r)+" s":"wyłączone"} | tryb: ${db?"Firebase":"lokalny"}`);return}
  if(c==="events"){
    if(a[1]!=="off"&&!(+a[1]>0)){say("Użycie: events <sekundy (min. 10) | off>");return}
    const v=a[1]==="off"?0:Math.min(1,10/Math.max(10,+a[1]));
    cfg.r.push({a:tick()+3,v});cfg.r=cfg.r.slice(-40);await cfgSave();
    say(v?`Zdarzenia średnio co ${Math.round(10/v)} s, obowiązuje za ok. 30 s.`:"Zdarzenia wyłączone za ok. 30 s.");return}
  if(c==="event"){
    const sy=(a[1]||"").toUpperCase(),g=sy==="MARKET",i=g?-1:C.findIndex(x=>x.s===sy);
    if(!g&&i<0){say("Nie ma takiej spółki. Użycie: event <SYMBOL|market> [pos|neg]");return}
    const sg=sgn(a[2]),L=g?TG:TPL,ks=L.map((x,k)=>k).filter(k=>Math.sign(L[k][1])===sg),k=ks[Math.floor(Math.random()*ks.length)];
    cfg.f.push({s:tick()+2,i,k,m:L[k][1]*(.8+.4*Math.random())});cfg.f=cfg.f.slice(-30);await cfgSave();
    say("Zaplanowano: "+headline({i,k}));return}
  if(["players","del","yes","reset","give"].includes(c)&&needDb())return;
  if(c==="players"){const L=(await allPlayers()).sort((x,y)=>(y.worth||0)-(x.worth||0));say("Graczy: "+L.length);
    L.slice(0,60).forEach(x=>say(`${x.name} | ${money(x.worth||0)} | ${x.id.slice(0,6)} | ${x.ts?Math.round((Date.now()-x.ts)/60000)+" min temu":"?"}`));return}
  if(c==="del"){const pat=nrm(a.slice(1).join(" "));if(!pat){say("Użycie: del <fragment nicku | *>");return}
    const m=(await allPlayers()).filter(x=>x.id!==uid&&(pat==="*"||nrm(x.name).includes(pat)));
    if(!m.length){say("Brak pasujących kont.");return}
    m.slice(0,15).forEach(x=>say(`  ${x.name} (${x.id.slice(0,6)})`));if(m.length>15)say(`  …i ${m.length-15} więcej`);
    pend=m.map(x=>x.id);say(`Znaleziono ${m.length}. Wpisz yes, aby usunąć.`);return}
  if(c==="yes"){if(!pend){say("Nic do potwierdzenia.");return}
    await Promise.all(pend.map(id=>fs.deleteDoc(fs.doc(db,"players",id))));say(`Usunięto ${pend.length}.`);pend=null;loadLb();return}
  if(c==="reset"||c==="give"){
    const amt=+a[a.length-1],nick=(c==="give"?a.slice(1,-1):a.slice(1)).join(" ");
    if(!nick||(c==="give"&&!isFinite(amt))){say("Użycie: reset <nick> | give <nick> <kwota>");return}
    const m=(await allPlayers()).filter(x=>nrm(x.name)===nrm(nick));if(!m.length){say("Nie znaleziono gracza.");return}
    for(const x of m)await fs.updateDoc(fs.doc(db,"players",x.id),c==="reset"?{c:START_CASH,h:{},worth:START_CASH,ts:Date.now()}:{c:(x.c||0)+amt,worth:(x.worth||0)+amt,ts:Date.now()});
    say(`Gotowe (${m.length}).`);loadLb();return}
  say("Nieznana komenda. Wpisz help.");
}
init();
