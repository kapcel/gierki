<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milionerzy Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b2e;--bg2:#0b1240;--card:#111a55cc;--line:#2a3a8f;--tx:#f3f5ff;--mut:#9aa6e0;--gold:#ffb627;--gold2:#ffd76a;--ok:#2fd27a;--bad:#ff4d5e;--sel:#ff9a1f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:400 16px/1.5 Archivo,system-ui,sans-serif;color:var(--tx);
 background:radial-gradient(ellipse 80% 60% at 50% -10%,#3a2a9c 0,#14187a 35%,var(--bg) 75%) fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
 conic-gradient(from 200deg at 50% -20%,transparent 0 10deg,#ffffff09 10deg 14deg,transparent 14deg 32deg,#ffffff07 32deg 36deg,transparent 36deg 60deg,#ffffff08 60deg 64deg,transparent 64deg)}
main{max-width:1100px;margin:0 auto;padding:24px 16px 60px;position:relative}
h1{font:400 clamp(40px,8vw,76px)/1 "Archivo Black",Archivo,sans-serif;margin:6px 0 4px;text-align:center;letter-spacing:-.01em;
 background:linear-gradient(180deg,#fff 20%,var(--gold2) 60%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px #ffb62755)}
.sub{text-align:center;color:var(--mut);margin:0 0 26px}
h2{font:800 20px/1.2 Archivo,sans-serif;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;backdrop-filter:blur(6px);box-shadow:0 10px 40px #0006}
input{width:100%;font:inherit;color:var(--tx);background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input::placeholder{color:#6f7cbd}
button{font:800 16px Archivo,sans-serif;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1700;box-shadow:0 4px 0 #b9740a}
button:hover{filter:brightness(1.07)}button:active{transform:translateY(2px);box-shadow:0 2px 0 #b9740a}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
button.alt{background:transparent;color:var(--tx);border:2px solid var(--line);box-shadow:none}
button.danger{background:linear-gradient(180deg,#ff7a85,var(--bad));color:#fff;box-shadow:0 4px 0 #a3202d}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.hr{text-align:center;color:var(--mut);margin:16px 0}
.code{font:400 40px "Archivo Black",sans-serif;letter-spacing:.15em;color:var(--gold);text-align:center;margin:2px 0}
.hint{color:var(--mut);text-align:center;font-size:14px}
.err{color:var(--bad);text-align:center;min-height:22px;margin:10px 0 0}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.p{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:9px 10px;text-align:center;position:relative}
.p b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .m{color:var(--gold2);font-weight:800}
.p .st{font-size:12px;color:var(--mut)}
.p.lock{border-color:var(--sel)}
.p.out{opacity:.45}.p.win{border-color:var(--ok);box-shadow:0 0 0 4px #2fd27a33}
.p.me:after{content:"Ty";position:absolute;top:5px;right:8px;font-size:11px;color:var(--gold);font-weight:800}
/* plansza gry */
.stage{display:grid;grid-template-columns:1fr 250px;gap:16px;align-items:start}
@media(max-width:860px){.stage{grid-template-columns:1fr}.ladder{order:-1}}
.ladder{padding:12px 10px}
.ladder ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:2px}
.ladder li{display:flex;justify-content:space-between;padding:3px 12px;border-radius:99px;font-weight:800;font-size:14px;color:var(--gold2)}
.ladder li span{color:var(--mut);font-weight:600}
.ladder li.g{color:#fff}
.ladder li.cur{background:linear-gradient(90deg,var(--sel),var(--gold));color:#2a1700}.ladder li.cur span{color:#2a1700}
.ladder li.done{opacity:.55}
@media(max-width:860px){.ladder ol{flex-direction:row-reverse;overflow-x:auto;gap:4px}.ladder li{flex:0 0 auto;font-size:12px;gap:6px}}
.ll{display:flex;justify-content:center;gap:14px;margin-bottom:14px}
.ll button{width:68px;height:68px;border-radius:50%;padding:0;font-size:28px;background:radial-gradient(circle at 50% 35%,#2c3aa8,#141c66);border:2px solid #6f7fe0;box-shadow:0 0 18px #3d4fe066;color:#fff;position:relative}
.ll button small{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10.5px;white-space:nowrap;color:var(--mut);font-weight:600}
.ll button.used{opacity:.3;filter:grayscale(1)}
.ll button.used:after{content:"";position:absolute;inset:8px;background:linear-gradient(45deg,transparent 46%,var(--bad) 46% 54%,transparent 54%)}
.ll button.act{box-shadow:0 0 0 4px var(--gold),0 0 24px var(--gold)}
.qbox{position:relative;margin:30px 0 14px;padding:22px 26px;text-align:center;font:800 clamp(19px,3.4vw,26px)/1.3 Archivo,sans-serif;
 background:linear-gradient(180deg,#1b2580,#0b1146);border:2px solid #8fa0ff;clip-path:polygon(28px 0,calc(100% - 28px) 0,100% 50%,calc(100% - 28px) 100%,28px 100%,0 50%);min-height:96px;display:flex;align-items:center;justify-content:center}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mut);font-size:14px}
.cat{display:inline-block;background:var(--gold);color:#2a1700;font-weight:800;border-radius:99px;padding:2px 12px;font-size:13px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.ans{grid-template-columns:1fr}}
.a{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 30px;min-height:30px;font:600 17px/1.25 Archivo,sans-serif;color:#fff;
 background:linear-gradient(180deg,#1b2580,#0b1146);border:2px solid #8fa0ff;clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,20px 100%,0 50%);position:relative;transition:filter .15s}
.a:hover{filter:brightness(1.25)}
.a b{color:var(--sel);font-weight:800}
.a.sel{background:linear-gradient(180deg,#ffb33d,#e07a00);color:#1d0f00}.a.sel b{color:#fff}
.a.ok{background:linear-gradient(180deg,#4ff0a0,#139a55);color:#05200f}.a.ok b{color:#fff}
.a.bad{background:linear-gradient(180deg,#ff7a85,#b81f2e)}
.a.gone{visibility:hidden}
.a.dis{cursor:default}.a.dis:hover{filter:none}
.a .who{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.a .who i{font-style:normal;font-size:11px;background:#000a;color:#fff;border-radius:99px;padding:1px 7px}
.a .pct{margin-left:auto;font-size:13px;opacity:.9}
.timer{height:8px;background:var(--bg2);border-radius:9px;overflow:hidden;margin:14px 0}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--sel));width:100%}
.poll{display:flex;gap:10px;align-items:flex-end;justify-content:center;height:110px;margin:6px 0 4px}
.poll div{width:44px;text-align:center;font-size:12px;color:var(--mut)}
.poll div i{display:block;background:linear-gradient(180deg,var(--gold2),var(--sel));border-radius:6px 6px 0 0;margin-bottom:4px;min-height:2px}
.say{text-align:center;font:400 26px "Archivo Black",sans-serif;margin:8px 0}.say.ok{color:var(--ok)}.say.bad{color:var(--bad)}
.win{font:400 clamp(30px,6vw,50px) "Archivo Black",sans-serif;color:var(--gold);text-align:center;margin:6px 0}
.pod{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:16px 0}
.pod div{width:min(32%,180px);text-align:center;border-radius:14px 14px 0 0;padding:12px 8px;background:linear-gradient(180deg,#2a3aa8,#141c66);border:1px solid var(--line)}
.pod b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .m{color:var(--gold2);font-weight:800}
.on{background:linear-gradient(180deg,var(--gold2),var(--gold))!important;color:#2a1700!important;border-color:var(--gold)!important}
.pulse{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}
.flash{animation:flash .45s ease-in-out 4}@keyframes flash{50%{filter:brightness(1.8)}}
</style>
</head>

const seenKey = "mil_seen";
const loadSeen = () => { try { return new Set(JSON.parse(localStorage.getItem(seenKey) || "[]")); } catch { return new Set(); } };
const saveSeen = s => { try { localStorage.setItem(seenKey, JSON.stringify([...s].slice(-1500))); } catch {} };
function pickQ(tier){
  const used = room.used || {};
  let seen = loadSeen(), c = BANK.filter(q => q.t === tier && !used[q.id] && !seen.has(q.id));
  if (!c.length) { c = BANK.filter(q => q.t === tier && !used[q.id]); }
  if (!c.length) c = BANK.filter(q => !used[q.id]);
  const q = c[Math.random() * c.length | 0]; seen.add(q.id); saveSeen(seen);
  const opts = [q.a, ...q.w].sort(() => Math.random() - .5);
  return {id: q.id, text: q.q, cat: q.c, opts, tier};
}
const correctIdx = () => { const b = BANK[room.q?.id]; return b ? room.q.opts.indexOf(b.a) : -1; };

let AC; function tone(f, d, type = "sine", v = .08, delay = 0){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);}catch{} }
const SFX = {
  lock: () => { tone(330, .25, "triangle"); tone(495, .3, "triangle", .06, .08); },
  ok: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .35, "triangle", .08, i * .09)),
  bad: () => { tone(220, .5, "sawtooth", .05); tone(155, .7, "sawtooth", .05, .2); },
  sus: () => { tone(110, .25, "sine", .1); tone(110, .25, "sine", .1, .5); tone(110, .25, "sine", .1, 1); },
  ll: () => [880, 660, 990].forEach((f, i) => tone(f, .18, "square", .03, i * .07)),
};

function home(){
  app.innerHTML = `

    <h2>Twój pseudonim</h2>
    <input id="name" maxlength="16" placeholder="np. Kasia" value="${esc(localStorage.getItem("n")||"")}">

    <div class="hr">albo dołącz kodem</div>
    <div class="row"><input id="jc" maxlength="6" placeholder="KOD" style="text-transform:uppercase;letter-spacing:.2em;text-align:center"><button class="alt" id="join" style="flex:0 0 auto">Dołącz</button></div>
  </div>
  <div class="card" style="max-width:520px;margin:0 auto">
    <h2>Zasady</h2>
    <p style="margin:0 0 8px">Wszyscy dostają to samo pytanie i mają chwilę na odpowiedź. Dobra odpowiedź – wchodzisz szczebel wyżej. Zła – spadasz do kwoty gwarantowanej (<b>1 000 zł</b> lub <b>40 000 zł</b>) i odpadasz. Przed zatwierdzeniem możesz się wycofać z tym, co masz.</p>
    <p style="margin:0">Każdy ma trzy koła ratunkowe: ${Object.values(LL).map(l => `<b>${l[0]} ${l[1]}</b> – ${l[2]}`).join(" ")}</p>
  </div>`;
  const nm = () => { const v = $("#name").value.trim(); if(!v){showErr("Wpisz pseudonim."); return null} localStorage.setItem("n",v); showErr(); return v; };
  $("#create").onclick = async () => {
    const n = nm(); if(!n) return;
    try{
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      code = Array.from({length:6}, () => chars[Math.random()*chars.length|0]).join("");
      await set(rc(), {game:"mil", host:uid, phase:"lobby", created:Date.now(), players:{[uid]:fresh(n, 0)}});
      enter();
    }catch(e){ showErr("Nie można utworzyć lobby: " + e.message); }
  };
  $("#join").onclick = async () => {
    const n = nm(); if(!n) return;
    const c = $("#jc").value.trim().toUpperCase(); if(!c){showErr("Wpisz kod lobby.");return}
    try{
      code = c;
      const snap = await get(rc());
      if(!snap.exists() || snap.val().game !== "mil"){ code = null; return showErr("Nie ma lobby Milionerów o takim kodzie."); }
      const r = snap.val(), ps = r.players || {};
      if(!ps[uid]){
        if(r.phase !== "lobby") { code = null; return showErr("Gra już trwa."); }
        if(Object.keys(ps).length >= MAX) { code = null; return showErr(`Lobby jest pełne (${MAX} graczy).`); }
        const order = Math.max(-1, ...Object.values(ps).map(p => p.order)) + 1;
        await set(ref(db, `rooms/${code}/players/${uid}`), fresh(n, order));
      }
      enter();
    }catch(e){ code = null; showErr("Nie można dołączyć: " + e.message); }
  };
  $("#jc").addEventListener("keydown", e => { if(e.key === "Enter") $("#join").click(); });
}
const fresh = (name, order) => ({name, order, lv:0, won:0, st:"in", tt:0, ll:{cut:false, spy:false, dbl:false}});

    if(!s.exists()){ leave(); return showErr("Lobby zostało zamknięte."); }
    const prevKey = lastPhaseKey;
    room = s.val();
    lastPhaseKey = room.phase + "|" + (room.round || 0);
    if (prevKey !== lastPhaseKey) { picking = []; onPhase(prevKey); }
    render(); hostLogic();
  });
}
function leave(){ if(unsub) unsub(); unsub=null; code=null; room=null; clearTimeout(qTimer); clearInterval(tick); home(); }
function onPhase(prev){
  if (!prev) return;
  const p = me();
  if (room.phase === "suspense") SFX.sus();
  if (room.phase === "reveal" && p) { const mine = p.res; if (mine === "ok") SFX.ok(); else if (mine === "bad") SFX.bad(); }
}

/* ---------- widoki ---------- */
function playersHTML(showPick){
  return `<div class="players">${plist(room).map(p => {
    const cls = p.st === "out" || p.st === "quit" ? "out" : p.st === "win" ? "win" : (room.phase === "q" && p.pick != null ? "lock" : "");
    const st = p.st === "quit" ? "wycofał(a) się" : p.st === "out" ? "odpada" : p.st === "win" ? "MILIONER!" : room.phase === "q" ? (p.pick != null ? "✔ zatwierdzone" : "myśli…") : room.phase === "lobby" ? "gotowy" : "w grze";
    const ll = Object.keys(LL).map(k => p.ll?.[k] ? "" : LL[k][0]).join("");
    return `<div class="p ${cls} ${p.id===uid?"me":""}"><b>${esc(p.name)}${p.id===room.host?" ★":""}</b><div class="m">${zl(p.won)}</div><div class="st">${st}${room.phase!=="lobby" && ll ? " · " + ll : ""}</div></div>`;
  }).join("")}</div>`;
}
function ladderHTML(lv, st){
  return `<div class="card ladder"><ol>${LADDER.map((v, i) => `<li class="${SAFE.includes(i)?"g":""} ${i===lv && st==="in" ? "cur" : ""} ${i<lv?"done":""}"><span>${i+1}</span>${zl(v)}</li>`).join("")}</ol></div>`;
}
function render(){
  const isHost = room.host === uid, ph = room.phase, ps = room.players || {}, n = Object.keys(ps).length;
  let h = `<div class="card" style="padding:12px 18px"><div class="row" style="align-items:center"><div><div class="hint" style="text-align:left">Kod lobby</div><div class="code" style="text-align:left;font-size:30px">${esc(code)}</div></div>
    <div class="hint" style="text-align:right">Gracze: ${n}/${MAX} · ★ prowadzący${room.round?` · pytanie <b style="color:var(--gold)">${room.round}/12</b>`:""}</div></div></div>`;
  if (ph === "lobby") {
    h += `<div class="card"><h2>Gracze w lobby</h2>${playersHTML()}</div>
      <div class="row" style="max-width:520px;margin:0 auto">${isHost ? `<button id="start">Rozpocznij grę</button>` : `<div class="hint" style="align-self:center">Czekamy, aż prowadzący rozpocznie grę…</div>`}
      <button class="alt" id="leave">Wyjdź</button></div>`;
  } else if (ph === "over") {
    const rank = plist(room).sort((a, b) => (b.won - a.won) || (a.tt - b.tt));
    const top = rank.slice(0, 3), order = [top[1], top[0], top[2]].filter(Boolean);
    h += `<div class="card"><div class="hint">${rank[0]?.won >= 1000000 ? "Mamy milionera!" : "Zwycięzca"}</div><div class="win">${esc(rank[0]?.name || "—")}</div>
      <div class="pod">${order.map(p => { const pl = rank.indexOf(p); return `<div style="height:${[150,120,95][pl]}px"><div style="font-size:26px">${["🥇","🥈","🥉"][pl]}</div><b>${esc(p.name)}</b><div class="m">${zl(p.won)}</div></div>`; }).join("")}</div>
      <div class="hint" style="margin-bottom:10px">Przy równych kwotach wygrywa szybszy (suma czasów odpowiedzi).</div>${playersHTML()}</div>
      <div class="row" style="max-width:520px;margin:0 auto">${isHost?`<button id="again">Zagraj ponownie</button>`:""}<button class="alt" id="leave">Wyjdź</button></div>`;
  } else {
    const p = me() || {}, q = room.q || {}, inGame = p.st === "in", ci = correctIdx();
    const dblOn = p.dblR === room.round, spyOn = p.spyR === room.round, cut = p.cutR === room.round ? (p.cut || []) : [];
    const locked = p.pick != null, show = ph === "reveal";
    h += `<div class="stage"><div>`;
    h += `<div class="ll">${Object.entries(LL).map(([k, l]) => `<button data-ll="${k}" title="${esc(l[1] + ": " + l[2])}" class="${p.ll?.[k] ? "used" : ""} ${(k==="dbl"&&dblOn)||(k==="spy"&&spyOn)||(k==="cut"&&cut.length)?"act":""}" ${!inGame || locked || ph!=="q" || p.ll?.[k] ? "disabled" : ""}>${l[0]}<small>${l[1]}</small></button>`).join("")}</div>`;
    h += `<div class="qmeta" style="margin-top:28px"><span class="cat">${esc(q.cat)}</span><span>Pytanie ${room.round}/12 za <b style="color:var(--gold2)">${zl(LADDER[room.round-1])}</b></span></div>`;
    h += `<div class="qbox">${esc(q.text)}</div>`;
    if (ph === "q") h += `<div class="timer"><i id="bar"></i></div>`;
    // rozkład wyborów rywali (koło „Podgląd”) i podpisy na odpowiedziach po odsłonięciu
    const picksBy = [[], [], [], []];
    for (const o of plist(room)) { if (o.pick != null && o.pickR === room.round) { picksBy[o.pick].push(o); if (o.pick2 != null) picksBy[o.pick2].push(o); } }
    let poll = null;
    if (spyOn && ph === "q") poll = spyPoll(picksBy, p, ci);
    h += `<div class="ans">${q.opts.map((o, i) => {
      let cls = "a";
      const mineSel = locked ? (p.pick === i || p.pick2 === i) : picking.includes(i);
      if (cut.includes(i) && !show) cls += " gone";
      if (mineSel) cls += " sel";
      if (show && i === ci) cls += " ok flash";
      else if (show && mineSel) cls += " bad";
      if (!inGame || locked || ph !== "q") cls += " dis";
      const who = show ? `<span class="who">${picksBy[i].map(x => `<i>${esc(x.name)}</i>`).join("")}</span>` : poll ? `<span class="pct">${poll[i]}</span>` : "";
      return `<button class="${cls}" data-a="${i}"><b>${L[i]}:</b> ${esc(o)} ${who}</button>`;
    }).join("")}</div>`;
    if (ph === "q" && inGame) {
      if (!locked) {
        const need = dblOn ? 2 : 1;
        h += `<div class="row" style="margin-top:16px">
          <button id="lock" ${picking.length < need ? "disabled" : ""}>${picking.length < need ? (dblOn ? "Zaznacz dwie odpowiedzi" : "Zaznacz odpowiedź") : "Ostateczna odpowiedź!"}</button>
          <button class="danger" id="quit">Wycofuję się z ${zl(p.won)}</button></div>`;
      } else h += `<div class="say pulse" style="font-size:20px;margin-top:16px">Odpowiedź zatwierdzona – czekamy na pozostałych…</div>`;
    } else if (ph === "q") h += `<div class="hint" style="margin-top:14px">Obserwujesz grę – ${p.st==="quit"?"wycofałeś się":"odpadłeś"} z kwotą ${zl(p.won)}.</div>`;
    if (ph === "suspense") h += `<div class="say pulse">Sprawdźmy…</div>`;
    if (show) {
      const r = p.res;
      h += r === "ok" ? `<div class="say ok">Dobrze! Masz ${zl(p.won)}</div>` : r === "bad" ? `<div class="say bad">Niestety… zostajesz z ${zl(p.won)}</div>` : r === "none" ? `<div class="say bad">Czas minął – zostajesz z ${zl(p.won)}</div>` : `<div class="hint">Poprawna odpowiedź: <b style="color:var(--tx)">${L[ci]}: ${esc(q.opts[ci])}</b></div>`;
    }
    h += `<div class="card" style="margin-top:20px">${playersHTML()}</div><div class="row" style="max-width:300px"><button class="alt" id="leave">Wyjdź z gry</button></div>`;
    h += `</div>${ladderHTML(p.lv || 0, p.st)}</div>`;
  }
  app.innerHTML = h;
  bind();
  clearInterval(tick);
  if (ph === "q") tick = setInterval(() => { const b = $("#bar"); if (b) b.style.width = Math.max(0, (room.tEnd - Date.now()) / room.tDur * 100) + "%"; }, 150);
}
// koło „Podgląd”: realne wybory rywali; gdy brak rywali – symulowany sondaż widowni
function spyPoll(picksBy, p, ci){
  const others = picksBy.map(a => a.filter(x => x.id !== uid).length), total = others.reduce((a, b) => a + b, 0);
  if (total >= 1 && active(room).length > 1) return others.map(n => `${n} 👤`);
  let s = (room.q.id * 7919 + uid.length * 131 + room.round * 17) % 2147483647; const rnd = () => (s = s * 16807 % 2147483647) / 2147483647;
  const acc = [.72, .55, .42][room.q.tier] + rnd() * .15;
  const cut = p.cutR === room.round ? p.cut || [] : [];
  const w = [0, 1, 2, 3].map(i => cut.includes(i) ? 0 : i === ci ? acc * 100 : rnd() * 35);
  const sum = w.reduce((a, b) => a + b, 0) || 1;
  return w.map(x => Math.round(x / sum * 100) + "%");
}
function bind(){
  const isHost = room.host === uid;
  $("#leave")?.addEventListener("click", async () => {
    if (isHost) await set(rc(), null);
    else if (room.phase === "lobby") await set(ref(db, `rooms/${code}/players/${uid}`), null);
    else if (me()?.st === "in") await update(ref(db, `rooms/${code}/players/${uid}`), {st:"quit", won: me().won});
    leave();
  });
  $("#start")?.addEventListener("click", startGame);
  $("#again")?.addEventListener("click", startGame);
  document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const p = me(); if (room.phase !== "q" || p?.st !== "in" || p.pick != null) return;
    const i = +b.dataset.a, max = p.dblR === room.round ? 2 : 1;
    if ((p.cutR === room.round ? p.cut || [] : []).includes(i)) return;
    if (picking.includes(i)) picking = picking.filter(x => x !== i);
    else { picking.push(i); if (picking.length > max) picking.shift(); }
    tone(600, .06, "square", .03); render();
  });
  $("#lock")?.addEventListener("click", async () => {
    const p = me(); if (!p || p.pick != null) return;
    SFX.lock();
    await update(ref(db, `rooms/${code}/players/${uid}`), {pick: picking[0], pick2: picking[1] ?? null, pickR: room.round, t: Math.max(0, Date.now() - (room.tEnd - room.tDur))});
  });
  $("#quit")?.addEventListener("click", async () => {
    const p = me(); if (!p || p.pick != null) return;
    if (!confirm(`Na pewno wycofać się z ${zl(p.won)}?`)) return;
    await update(ref(db, `rooms/${code}/players/${uid}`), {st:"quit"});
  });
  document.querySelectorAll("[data-ll]").forEach(b => b.onclick = async () => {
    const k = b.dataset.ll, p = me(); if (!p || p.ll?.[k] || p.pick != null || room.phase !== "q") return;
    if (!confirm(`Użyć koła „${LL[k][1]}”? ${LL[k][2]}`)) return;
    SFX.ll();
    const f = {[`ll/${k}`]: true};
    if (k === "cut") { const ci = correctIdx(); const wrong = [0, 1, 2, 3].filter(i => i !== ci).sort(() => Math.random() - .5).slice(0, 2); f.cut = wrong; f.cutR = room.round; picking = picking.filter(i => !wrong.includes(i)); }
    if (k === "spy") f.spyR = room.round;
    if (k === "dbl") f.dblR = room.round;
    await update(ref(db, `rooms/${code}/players/${uid}`), f);
  });
}

/* ---------- logika prowadzącego (tylko host) ---------- */
async function startGame(){
  try{
    const ps = {...room.players}; let i = 0;
    Object.keys(ps).sort((a, b) => ps[a].order - ps[b].order).forEach(id => { ps[id] = fresh(ps[id].name, i++); });
    lastHandled = "";
    await update(rc(), {players:ps, used:null, round:0, ans:null});
    await nextRound(1);
  }catch(e){ showErr("Błąd startu: " + e.message); }
}
async function nextRound(r){
  const q = pickQ(tierOf(r - 1)), d = TIME[q.tier];
  await update(rc(), {phase:"q", round:r, q, ans:null, tEnd:Date.now() + d, tDur:d, [`used/${q.id}`]:true});
}
function hostLogic(){
  if (!room || room.host !== uid) return;
  clearTimeout(qTimer);
  const ph = room.phase;
  if (ph === "q") {
    const act = active(room);
    if (!act.length) { if (lastHandled === "end" + room.round) return; lastHandled = "end" + room.round; return update(rc(), {phase:"over"}); }
    if (act.every(p => p.pick != null && p.pickR === room.round)) return toSuspense();
    qTimer = setTimeout(toSuspense, Math.max(0, room.tEnd - Date.now()) + 300);
  } else if (ph === "suspense") qTimer = setTimeout(reveal, SUSPENSE);
  else if (ph === "reveal") qTimer = setTimeout(afterReveal, PAUSE);
}
async function toSuspense(){
  if (room?.phase !== "q") return;
  const key = "s" + room.round; if (lastHandled === key) return; lastHandled = key;
  await update(rc(), {phase:"suspense"});
}
async function reveal(){
  if (room?.phase !== "suspense") return;
  const key = "r" + room.round; if (lastHandled === key) return; lastHandled = key;
  const ci = correctIdx(), f = {phase:"reveal", ans:ci};
  for (const p of plist(room)) {
    const base = `players/${p.id}/`;
    if (p.st !== "in") { f[base + "res"] = null; continue; }
    const answered = p.pick != null && p.pickR === room.round;
    const ok = answered && (p.pick === ci || p.pick2 === ci);
    f[base + "tt"] = (p.tt || 0) + (answered ? p.t || 0 : room.tDur);
    if (ok) { const lv = p.lv + 1; f[base + "lv"] = lv; f[base + "won"] = LADDER[lv - 1]; f[base + "res"] = "ok"; if (lv >= LADDER.length) f[base + "st"] = "win"; }
    else { f[base + "st"] = "out"; f[base + "won"] = safeWon(p.lv); f[base + "res"] = answered ? "bad" : "none"; }
  }
  await update(rc(), f);
}
async function afterReveal(){
  if (room?.phase !== "reveal") return;
  const key = "a" + room.round; if (lastHandled === key) return; lastHandled = key;
  const f = {};
  for (const p of plist(room)) { f[`players/${p.id}/pick`] = null; f[`players/${p.id}/pick2`] = null; f[`players/${p.id}/res`] = null; }
  await update(rc(), f);
  if (!active(room).length || room.round >= LADDER.length) return update(rc(), {phase:"over"});
  await nextRound(room.round + 1);
}

if (db) home();
</script>
</body>
