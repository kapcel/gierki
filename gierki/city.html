<div id="top">

<script type="module">
// ============================================================
// 1. KONFIGURACJA FIREBASE — wklej tu dane ze swojego projektu
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyAO1VCLQSVFdkRacQCLl6XVcTh4Es0pCIk",
  authDomain: "city2-9355f.firebaseapp.com",
  projectId: "city2-9355f",
  storageBucket: "city2-9355f.firebasestorage.app",
  messagingSenderId: "724991411064",
  appId: "1:724991411064:web:671f63818ce2356a9ffe8d",
  measurementId: "G-9VKEEWB5MV",
  databaseURL: "https://city2-9355f-default-rtdb.europe-west1.firebasedatabase.app"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, remove, get, runTransaction, onValue, onChildAdded, onChildChanged, onChildRemoved }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ============================================================
// 2. USTAWIENIA GRY
// ============================================================
const N = 128;              // mapa N x N kafelków (128 x 128 = 16 384 pól)
const TW = 64, TH = 32;     // wymiary kafelka izometrycznego
const START_CASH = 5000;

// Typy budynków: koszt, wysokość bryły, kolory
const BUILD = {
  road:    { name: "Droga",   cost: 10,  h: 0,  color: "#4b4f55" },
  house:   { name: "Dom",     cost: 100, h: 18, color: "#e0a368" },
  shop:    { name: "Sklep",   cost: 300, h: 24, color: "#5fa8d3" },
  factory: { name: "Fabryka", cost: 600, h: 34, color: "#b8555c" },
  rail:    { name: "Tor",      cost: 20,  h: 0,  color: "#8d8470" },
  station: { name: "Stacja",   cost: 150, h: 4,  color: "#c9c2b0" },
  mine:    { name: "Kopalnia", cost: 500, h: 14, color: "#6e5a48" },
  sawmill: { name: "Tartak",   cost: 400, h: 14, color: "#a67c52" },
  steel:   { name: "Huta",     cost: 800, h: 28, color: "#7b8794" },
  buyer:   { name: "Skup",     cost: 0,   h: 22, color: "#d4b254" },   // budowany przez system na brzegach mapy
};
// Pojazdy: cap = ładowność, speed = kafelki na sekundę
const VEH = {
  truck: { name: "Ciężarówka", cost: 200, cap: 12, speed: 1.2 },
  train: { name: "Pociąg",     cost: 600, cap: 40, speed: 2.2 },
};

// ============================================================
// 3. STAN
// ============================================================
let uid, myName, cash = START_CASH;
let isAdmin = false;
let tool = "road";                      // aktualne narzędzie ("bulldoze" = burzenie)
const tiles = {};                       // "x_y" -> { t: typ, o: właściciel(uid), n: nazwa }
const cam = { x: 0, y: 0, z: 1 };       // kamera
let hover = null;

const $ = id => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d");

// ============================================================
// 4. TEREN (generowany z szumu — identyczny u wszystkich graczy)
// ============================================================
const hash = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
function noise(x, y, s) {                       // szum wartościowy; s = skala (większe = gładszy teren)
  const xi = Math.floor(x / s), yi = Math.floor(y / s), fx = x / s - xi, fy = y / s - yi;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const top = hash(xi, yi) * (1 - sx) + hash(xi + 1, yi) * sx;
  const bot = hash(xi, yi + 1) * (1 - sx) + hash(xi + 1, yi + 1) * sx;
  return top * (1 - sy) + bot * sy;
}
const terrain = [], depth = [], groundCol = [];  // 0 woda, 1 trawa, 2 las, 3 piasek
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  const i = y * N + x, r = hash(x * 3, y * 7);
  const v = 0.55 * noise(x, y, 26) + 0.3 * noise(x + 50, y + 50, 11) + 0.15 * noise(x, y, 4);
  const forest = noise(x + 200, y + 90, 8);
  terrain[i] = v < 0.43 ? 0 : v < 0.46 ? 3 : forest > 0.6 ? 2 : 1;
  const d = Math.max(0, 0.43 - v);               // głębokość wody
  groundCol[i] = [
    `hsl(${200 + d * 40},58%,${Math.max(22, 46 - d * 80)}%)`,
    `hsl(${88 + r * 22},${36 + r * 10}%,${36 + r * 8}%)`,
    `hsl(${100 + r * 15},35%,${28 + r * 6}%)`,
    `hsl(${44 + r * 6},45%,${66 + r * 6}%)`,
  ][terrain[i]];
}

// Skupy na 4 brzegach mapy: każdy ma drogę i tor prowadzące w głąb lądu.
// Są częścią świata (nie zapisują się w bazie) i płacą najwięcej za surowce i towary.
const BUYERS = [
  { x: 3,     y: N / 2, dx: 1,  dy: 0,  name: "Skup Zachód" },
  { x: N - 4, y: N / 2, dx: -1, dy: 0,  name: "Skup Wschód" },
  { x: N / 2, y: 3,     dx: 0,  dy: 1,  name: "Skup Północ" },
  { x: N / 2, y: N - 4, dx: 0,  dy: -1, name: "Skup Południe" },
];
for (const b of BUYERS) {
  const px = b.dy, py = b.dx;                                   // kierunek poprzeczny (tor biegnie obok drogi)
  for (let i = 0; i < 9; i++) for (let j = -3; j <= 4; j++) {   // wymuszamy ląd wokół skupu
    const k = (b.y + b.dy * i + py * j) * N + (b.x + b.dx * i + px * j);
    terrain[k] = 1; groundCol[k] = "hsl(95,38%,38%)";
  }
  tiles[b.x + "_" + b.y] = { t: "buyer", o: "sys", n: b.name };
  tiles[(b.x + px) + "_" + (b.y + py)] = { t: "rail", o: "sys" };
  for (let i = 1; i <= 6; i++) {
    tiles[(b.x + b.dx * i) + "_" + (b.y + b.dy * i)] = { t: "road", o: "sys" };
    tiles[(b.x + b.dx * i + px) + "_" + (b.y + b.dy * i + py)] = { t: "rail", o: "sys" };
  }
}

// ============================================================
// 5. FIREBASE: synchronizacja mapy i graczy
// ============================================================
async function init() {
  const cred = await signInAnonymously(getAuth(app));
  uid = cred.user.uid;

  myName = localStorage.getItem("cityName") || prompt("Twoja nazwa firmy:") || "Gracz " + uid.slice(0, 4);
  localStorage.setItem("cityName", myName);
  $("name").textContent = myName;

  // wczytaj zapisaną gotówkę
  const snap = await get(ref(db, "players/" + uid));
  cash = snap.exists() ? snap.val().cash : START_CASH;
  savePlayer();

  // mapa na żywo: każda zmiana trafia do wszystkich
  const tilesRef = ref(db, "tiles");
  onChildAdded(tilesRef,   s => { tiles[s.key] = s.val(); ver++; });
  onChildChanged(tilesRef, s => { tiles[s.key] = s.val(); ver++; });
  onChildRemoved(tilesRef, s => { delete tiles[s.key]; ver++; });

  // ranking
  onValue(ref(db, "players"), s => {
    const list = Object.values(s.val() || {}).sort((a, b) => b.cash - a.cash).slice(0, 8);
    $("board").innerHTML = "<b>Ranking</b><br>" + list.map(p => `${p.name}: ${Math.floor(p.cash)} $`).join("<br>");
  });

  // reset mapy zrobiony przez admina — wszyscy dostają gotówkę startową
  let first = true;
  onValue(ref(db, "resetAt"), () => {
    if (first) { first = false; return; }
    cash = START_CASH; savePlayer(); say("Mapa została zresetowana!");
  });

  onValue(ref(db, "stock"), s => stock = s.val() || {});
  onValue(ref(db, "vehicles"), s => { vehicles = s.val() || {}; ver++; });
  setInterval(economyTick, 5000);
}

function savePlayer() {
  set(ref(db, "players/" + uid), { name: myName, cash: Math.floor(cash) });
}

// ============================================================
// 6. EKONOMIA: towary, przetwórstwo, stacje i pojazdy
// ============================================================
// Łańcuch dostaw:
//   Kopalnia -> ruda -> Huta -> stal ─┐
//   Tartak   -> drewno ───────────────┴-> Fabryka -> towary -> Sklep (sprzedaż klientom)
// Każdy surowiec / towar można też sprzedać w Skupie na brzegu mapy (x1.8 ceny).
// Stacja zbiera i oddaje towary budynkom w promieniu 2 pól.
// Ciężarówka jeździ po drogach, pociąg po torach, między dwiema stacjami (lub skupem).
const NEIGH = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const RECIPE = {                           // in = czego potrzebuje, out = co produkuje, rate = ilość na 5 s
  mine:    { out: "ore",  rate: 3 },
  sawmill: { out: "wood", rate: 3 },
  steel:   { in: ["ore"], out: "steel", rate: 2 },
  factory: { in: ["wood", "steel"], out: "goods", rate: 2 },
  shop:    { in: ["goods"], rate: 2 },
};
const PRICE = { ore: 4, wood: 4, steel: 9, goods: 14 };          // cena za sztukę za transport
const CARGO_PL = { ore: "ruda", wood: "drewno", steel: "stal", goods: "towary" };
const SELL = 12;                                                  // sklep: cena sprzedaży towaru klientom
const BUILDING = ["mine", "sawmill", "steel", "factory", "shop", "buyer"];
const DEFAULT_TIP = $("tip").textContent;

let stock = {}, vehicles = {}, ver = 0;    // stock[klucz][towar] = ilość; ver rośnie przy każdej zmianie mapy
const carry = {}, legs = {}, paths = {};

const typeAt = (x, y) => (tiles[x + "_" + y] || {}).t;
const nearRoad = (x, y) => NEIGH.some(([dx, dy]) => typeAt(x + dx, y + dy) === "road");
function countNear(x, y, r, type) {
  let n = 0;
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (typeAt(x + i, y + j) === type) n++;
  return n;
}
function inRange(x, y, r) {                // budynki produkcyjne w promieniu r
  const out = [];
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
    const k = (x + i) + "_" + (y + j), t = tiles[k];
    if (t && BUILDING.includes(t.t)) out.push(k);
  }
  return out;
}

// Bezpieczna zmiana magazynu (transakcja — kilku graczy może ruszać ten sam budynek)
async function adjust(key, cargo, delta, cap = 60) {
  let applied = 0;
  await runTransaction(ref(db, `stock/${key}/${cargo}`), v => {
    v = v || 0; const nv = Math.max(0, Math.min(cap, v + delta)); applied = nv - v; return nv;
  });
  return applied;
}

// Domy płacą podatek, jeśli stoją przy drodze (+2 $ / 5 s)
function income() {
  let sum = 0;
  for (const key in tiles) {
    const b = tiles[key]; if (b.o !== uid || b.t !== "house") continue;
    const [x, y] = key.split("_").map(Number);
    if (nearRoad(x, y)) sum += 2;
  }
  return sum;
}

// Co 5 s: właściciel produkuje i przetwarza w swoich budynkach
let busy = false;
async function economyTick() {
  if (busy) return; busy = true;
  let gain = income();
  try {
    for (const key in tiles) {
      const b = tiles[key], r = RECIPE[b.t]; if (b.o !== uid || !r) continue;
      const [x, y] = key.split("_").map(Number), st = stock[key] || {};
      if (!r.in) { await adjust(key, r.out, r.rate); continue; }                 // kopalnia, tartak
      if (r.out && (st[r.out] || 0) > 55) continue;                              // magazyn pełny
      let n = r.rate; for (const c of r.in) n = Math.min(n, st[c] || 0);
      if (n <= 0) continue;
      for (const c of r.in) await adjust(key, c, -n);
      if (r.out) await adjust(key, r.out, n);
      else gain += n * SELL * (1 + Math.min(6, countNear(x, y, 3, "house")) / 3); // sklep sprzedaje klientom
    }
  } finally { cash += gain; savePlayer(); busy = false; }
}

// --- trasy pojazdów (BFS po drogach lub torach) ---
const PASS = { truck: ["road", "station", "buyer"], train: ["rail", "station", "buyer"] };
function findPath(v) {
  if (!tiles[v.a] || !tiles[v.b]) return null;
  const ok = PASS[v.k], prev = { [v.a]: null }, q = [v.a];
  for (let i = 0; i < q.length && q[i] !== v.b; i++) {
    const [x, y] = q[i].split("_").map(Number);
    for (const [dx, dy] of NEIGH) {
      const k = (x + dx) + "_" + (y + dy), t = tiles[k];
      if (t && ok.includes(t.t) && !(k in prev)) { prev[k] = q[i]; q.push(k); }
    }
  }
  if (!(v.b in prev)) return null;
  const path = []; for (let k = v.b; k; k = prev[k]) path.unshift(k.split("_").map(Number));
  return path;
}
function getPath(id, v) {                  // trasa z cache (przeliczana po zmianie mapy)
  const c = paths[id]; if (c && c.ver === ver) return c.p;
  const p = findPath(v); paths[id] = { ver, p }; return p;
}
// Pozycja pojazdu wynika z zegara, więc każdy gracz widzi go w tym samym miejscu
const travelS = (id, v) => (Date.now() / 1000 + [...id].reduce((a, c) => a + c.charCodeAt(0), 0) * 7) * VEH[v.k].speed;
function posAt(path, s) {
  const L = path.length - 1, m = ((s % (2 * L)) + 2 * L) % (2 * L), u = m < L ? m : 2 * L - m;
  const i = Math.min(L - 1, Math.floor(u)), f = u - i;
  return toScreen(path[i][0] + (path[i + 1][0] - path[i][0]) * f, path[i][1] + (path[i + 1][1] - path[i][1]) * f);
}

// Dojazd do końca trasy: tylko klient właściciela rozlicza ładunek
setInterval(() => {
  if (!uid) return;
  for (const [id, v] of Object.entries(vehicles)) {
    if (v.o !== uid) continue;
    const p = getPath(id, v); if (!p || p.length < 2) continue;
    const leg = Math.floor(travelS(id, v) / (p.length - 1));
    if (legs[id] === undefined) { legs[id] = leg; continue; }
    if (leg === legs[id]) continue;
    const atB = (leg - 1) % 2 === 0; legs[id] = leg;                         // parzyste odcinki: A -> B
    arrive(id, v, atB ? v.b : v.a, atB ? v.a : v.b, p.length);
  }
}, 500);

async function arrive(id, v, here, dest, plen) {
  const [hx, hy] = here.split("_").map(Number), [dx, dy] = dest.split("_").map(Number), c = carry[id];
  if (c) {                                                                   // 1. rozładunek
    const buyer = (tiles[here] || {}).t === "buyer";
    const target = buyer ? null : inRange(hx, hy, 2).filter(k => (RECIPE[tiles[k].t]?.in || []).includes(c.cargo))
      .sort((a, b) => ((stock[a] || {})[c.cargo] || 0) - ((stock[b] || {})[c.cargo] || 0))[0];
    const n = target ? await adjust(target, c.cargo, c.n) : buyer ? c.n : 0;
    if (n > 0) {
      const pay = n * PRICE[c.cargo] * (1 + plen / 15) * (buyer ? 1.8 : 1);  // dłuższa trasa = więcej
      cash += pay; savePlayer(); say(`+${Math.floor(pay)} $ za dostawę (${n} × ${CARGO_PL[c.cargo]})`);
    }
    carry[id] = null;
  }
  const accepts = new Set();                                                 // 2. załadunek tego, co przyjmie cel
  if ((tiles[dest] || {}).t === "buyer") Object.keys(PRICE).forEach(x => accepts.add(x));
  else inRange(dx, dy, 2).forEach(k => (RECIPE[tiles[k].t]?.in || []).forEach(x => accepts.add(x)));
  let best = null;
  for (const k of inRange(hx, hy, 2)) {
    const o = RECIPE[tiles[k].t]?.out, n = o ? (stock[k] || {})[o] || 0 : 0;
    if (n > 0 && accepts.has(o) && (!best || n > best.n)) best = { k, o, n };
  }
  if (best) { const n = -(await adjust(best.k, best.o, -Math.min(VEH[v.k].cap, best.n))); if (n > 0) carry[id] = { cargo: best.o, n }; }
}

// Kupno pojazdu: kliknij stację startową, potem docelową
let pending = null;
function routeClick(x, y) {
  const key = x + "_" + y, t = (tiles[key] || {}).t;
  if (t !== "station" && t !== "buyer") return say("Kliknij stację lub skup.");
  if (!pending) { pending = key; return say("Teraz kliknij stację docelową."); }
  if (pending === key) { pending = null; return say("Anulowano."); }
  const veh = { k: tool, a: pending, b: key, o: uid }; pending = null;
  if (!findPath(veh)) return say(tool === "truck" ? "Brak drogi między stacjami." : "Brak toru między stacjami.");
  if (cash < VEH[tool].cost) return say("Za mało gotówki.");
  cash -= VEH[tool].cost;
  set(ref(db, "vehicles/" + Date.now().toString(36) + uid.slice(0, 3)), veh);
  savePlayer(); say(VEH[tool].name + " wyjeżdża na trasę.");
}

// ============================================================
// 7. BUDOWANIE I BURZENIE
// ============================================================
function act(x, y) {
  if (x < 0 || y < 0 || x >= N || y >= N) return;
  const key = x + "_" + y, existing = tiles[key];
  if (VEH[tool]) return routeClick(x, y);

  if (tool === "bulldoze") {
    if (!existing || existing.o === "sys") return;
    if (existing.o !== uid && !isAdmin) return say("To nie Twój budynek.");
    cash += BUILD[existing.t].cost * 0.5;                 // zwrot 50%
    remove(ref(db, "tiles/" + key)); remove(ref(db, "stock/" + key));
    savePlayer();
    return;
  }
  const ter = terrain[y * N + x];
  if (ter === 0) return say("Nie można budować na wodzie.");
  if (existing) return say("Pole jest zajęte.");
  if (tool === "sawmill" && ter !== 2) return say("Tartak stawia się w lesie.");
  const b = BUILD[tool];
  if (cash < b.cost) return say("Za mało gotówki.");

  cash -= b.cost;
  set(ref(db, "tiles/" + key), { t: tool, o: uid, n: myName });
  savePlayer();
}

let msgTimer;
function say(t) { $("msg").textContent = t; clearTimeout(msgTimer); msgTimer = setTimeout(() => $("msg").textContent = "", 4000); }

// ============================================================
// 8. RYSOWANIE (widok izometryczny, cienie, cykl dnia i nocy)
// ============================================================
const hw = TW / 2, hh = TH / 2;
const toScreen = (x, y) => ({ x: (x - y) * hw, y: (x + y) * hh });
function toTile(px, py) {
  const wx = (px - cam.x) / cam.z, wy = (py - cam.y) / cam.z;
  return { x: Math.round((wy / hh + wx / hw) / 2), y: Math.round((wy / hh - wx / hw) / 2) };
}
const terAt = (x, y) => (x < 0 || y < 0 || x >= N || y >= N) ? 0 : terrain[y * N + x];
const EDGE = [[1, 0, 1, 2], [0, 1, 2, 3], [-1, 0, 3, 0], [0, -1, 0, 1]];   // sąsiad -> krawędzie rombu

const HOUSE_COL = ["#e8c9a0", "#e0a368", "#c9d6a3", "#d98f8f"];
const ROOF_COL = ["#a8402f", "#6b4a3a", "#3f5a78"];
const CAR_COL = ["#d24b4b", "#3f7fd2", "#e8c84a", "#f0f0f0", "#4aa86a"];
const ownerCache = {};
const ownerColor = id => ownerCache[id] || (ownerCache[id] = `hsl(${[...String(id)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7)},80%,55%)`);

const shCache = {};
function shade(hex, f) {                      // przyciemnianie koloru (z cache)
  const k = hex + f; if (shCache[k]) return shCache[k];

// --- drogi z jeżdżącymi samochodami i latarniami ---

// --- natura ---

// --- jeden kafelek ---
function drawTile(x, y) {

  const c = [[p.x, p.y - hh], [p.x + hw, p.y], [p.x, p.y + hh], [p.x - hw, p.y]], ter = terrain[i];
  poly(c, groundCol[i]);

      ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(c[a][0], c[a][1]); ctx.lineTo(c[b][0], c[b][1]); ctx.stroke();

// --- klatka ---
function draw() {
  if (canvas.width !== innerWidth || canvas.height !== innerHeight) { canvas.width = innerWidth; canvas.height = innerHeight; }
  T = performance.now() / 1000;
  night = Math.max(0, Math.min(1, -Math.sin(Date.now() / 240000 * 6.2832) * 1.6));   // doba trwa 4 min, taka sama u wszystkich
  lod = cam.z < .8; lights.length = 0;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#0f2a35"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(cam.z, 0, 0, cam.z, cam.x, cam.y);

  const cs = [toTile(0, 0), toTile(canvas.width, 0), toTile(0, canvas.height), toTile(canvas.width, canvas.height)];   // widoczny obszar
  const x0 = Math.max(0, Math.min(...cs.map(c => c.x)) - 3), x1 = Math.min(N - 1, Math.max(...cs.map(c => c.x)) + 5);
  const y0 = Math.max(0, Math.min(...cs.map(c => c.y)) - 3), y1 = Math.min(N - 1, Math.max(...cs.map(c => c.y)) + 5);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) drawTile(x, y);
  drawVehicles();

  if (hover && hover.x >= 0 && hover.y >= 0 && hover.x < N && hover.y < N) {       // podgląd budowy: zielony = można
    const p = toScreen(hover.x, hover.y), occupied = !!tiles[hover.x + "_" + hover.y];
    const ok = tool === "bulldoze" ? occupied : VEH[tool] ? ["station", "buyer"].includes((tiles[hover.x + "_" + hover.y] || {}).t) : terrain[hover.y * N + hover.x] !== 0 && !occupied && cash >= BUILD[tool].cost;
    poly([[p.x, p.y - hh], [p.x + hw, p.y], [p.x, p.y + hh], [p.x - hw, p.y]], ok ? "#7dffa066" : "#ff6a6a66", "#fff");
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);                                               // noc
  if (night > .02) { ctx.fillStyle = `rgba(8,16,48,${night * .55})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  ctx.setTransform(cam.z, 0, 0, cam.z, cam.x, cam.y);
  if (lights.length) {

    for (const [lx, ly, r] of lights) {

      ctx.fillStyle = `rgba(255,220,140,${.25 * night})`; ctx.beginPath(); ctx.arc(lx, ly, r * .45, 0, 6.3); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  $("inc").textContent = income();
  const hk = hover && hover.x + "_" + hover.y, hb = hk && tiles[hk];                // opis budynku pod kursorem
  $("tip").textContent = hb && BUILD[hb.t] && BUILD[hb.t].h > 0
    ? `${BUILD[hb.t].name} (${hb.n || "system"}): ` + (Object.entries(stock[hk] || {}).map(([c, n]) => `${CARGO_PL[c]} ${n}`).join(", ") || "brak towarów")
    : DEFAULT_TIP;
  requestAnimationFrame(draw);
}

setInterval(() => {
  mctx.drawImage(miniBase, 0, 0);
  for (const k in tiles) { const [x, y] = k.split("_"); mctx.fillStyle = ownerColor(tiles[k].o); mctx.fillRect(x, y, 1, 1); }
  const c = toTile(innerWidth / 2, innerHeight / 2);
  mctx.strokeStyle = "#fff"; mctx.strokeRect(c.x - 5, c.y - 5, 10, 10);
}, 700);
mini.onclick = e => {
  const r = mini.getBoundingClientRect(), s = toScreen((e.clientX - r.left) / r.width * N, (e.clientY - r.top) / r.height * N);
  cam.x = innerWidth / 2 - s.x * cam.z; cam.y = innerHeight / 2 - s.y * cam.z;
};

// ============================================================
// 9. STEROWANIE (mysz / dotyk)
// ============================================================
let drag = null;
canvas.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false }; });
canvas.addEventListener("pointermove", e => {
  hover = toTile(e.clientX, e.clientY);
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 5) drag.moved = true;
  if (drag.moved) { cam.x = drag.cx + dx; cam.y = drag.cy + dy; }
});
canvas.addEventListener("pointerup", e => {
  if (drag && !drag.moved) { const t = toTile(e.clientX, e.clientY); act(t.x, t.y); }
  drag = null;
});
canvas.addEventListener("wheel", e => {
  const old = cam.z;
  cam.z = Math.max(0.25, Math.min(2.5, cam.z * (e.deltaY < 0 ? 1.1 : 0.9)));
  cam.x = e.clientX - (e.clientX - cam.x) * cam.z / old;     // zoom w stronę kursora
  cam.y = e.clientY - (e.clientY - cam.y) * cam.z / old;
});

// pasek narzędzi
const bar = $("bar");
[...Object.keys(BUILD).filter(k => k !== "buyer"), ...Object.keys(VEH), "bulldoze"].forEach(k => {
  const btn = document.createElement("button");
  btn.textContent = k === "bulldoze" ? "Burz" : `${(BUILD[k] || VEH[k]).name} (${(BUILD[k] || VEH[k]).cost} $)`;
  btn.onclick = () => { tool = k; [...bar.children].forEach(b => b.classList.remove("on")); btn.classList.add("on"); };
  if (k === tool) btn.classList.add("on");
  bar.appendChild(btn);
});

// ============================================================
// 10. KONSOLA (klawisz `)
// ============================================================
const con = $("con"), out = $("out"), inp = $("in");
const log = t => { out.textContent += t + "\n"; out.scrollTop = out.scrollHeight; };

addEventListener("keydown", e => {
  if (e.key === "`") {
    e.preventDefault();
    const open = con.style.display === "flex";
    con.style.display = open ? "none" : "flex";
    if (!open) { inp.focus(); if (!out.textContent) log("Konsola. Wpisz 'help'."); }
  }
});

inp.addEventListener("keydown", async e => {
  if (e.key !== "Enter") return;
  const line = inp.value.trim(); inp.value = "";
  if (!line) return;
  log("> " + line.replace(/^(login \S+ ).*/, "$1***"));
  const [cmd, ...args] = line.split(/\s+/);

  switch (cmd) {
    case "help":
      log("login <użytkownik> <hasło>  – logowanie admina\nlogout\nreset   – (admin) czyści całą mapę\ngive <ile>  – (admin) dodaje gotówkę\nwho     – status");
      break;
    case "login":
      // UWAGA: to zabezpieczenie jest tylko po stronie klienta (patrz instrukcja)
      if (args[0] === "admin" && args[1] === "admin") { isAdmin = true; log("Zalogowano jako admin."); }
      else log("Błędne dane.");
      break;
    case "logout": isAdmin = false; log("Wylogowano."); break;
    case "who": log(isAdmin ? "admin" : "gracz " + myName); break;
    case "give":
      if (!isAdmin) return log("Brak uprawnień. Użyj: login admin admin");
      cash += Number(args[0]) || 0; savePlayer(); log("Dodano gotówkę.");
      break;
    case "reset":
      if (!isAdmin) return log("Brak uprawnień. Użyj: login admin admin");
      await remove(ref(db, "tiles")); await remove(ref(db, "stock")); await remove(ref(db, "vehicles"));
      await set(ref(db, "resetAt"), Date.now());     // sygnał dla wszystkich klientów
      log("Mapa zresetowana.");
      break;
    default: log("Nieznana komenda. Wpisz 'help'.");
  }
});

// ============================================================
// START
// ============================================================
// kamera startuje na najbliższym lądzie od środka mapy
function findLand() {
  for (let r = 0; r < N / 2; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const x = N / 2 + dx, y = N / 2 + dy;
    if (terrain[y * N + x] === 1) return { x, y };
  }
  return { x: N / 2, y: N / 2 };
}
const start = toScreen(findLand().x, findLand().y);
cam.x = innerWidth / 2 - start.x * cam.z; cam.y = innerHeight / 2 - start.y * cam.z;
requestAnimationFrame(draw);     // mapa rysuje się od razu, także gdy Firebase nie odpowiada
init().catch(err => { say("Błąd Firebase: " + err.message); console.error(err); });
</script>
