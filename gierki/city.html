const hash = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
function noise(x, y, s) {
  const xi = Math.floor(x / s), yi = Math.floor(y / s), fx = x / s - xi, fy = y / s - yi;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const top = hash(xi, yi) * (1 - sx) + hash(xi + 1, yi) * sx;
  const bot = hash(xi, yi + 1) * (1 - sx) + hash(xi + 1, yi + 1) * sx;
  return top * (1 - sy) + bot * sy;
}

// Bezpieczna zmiana magazynu (transakcja – kilku graczy może ruszać ten sam budynek)
async function adjust(key, cargo, delta, cap = CAP) {
  let applied = 0;
  try {
    await runTransaction(ref(db, `stock/${key}/${cargo}`), v => {
      v = v || 0; const nv = Math.max(0, Math.min(cap, v + delta)); applied = nv - v; return nv;
    });
  } catch (e) { applied = 0; }
  return applied;
}

// 8. EKONOMIA FIRMY (co 5 s): czynsze, produkcja własnych zakładów

const nearType = (x, y, r, types) => { let n = 0; for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (types.includes((tiles[K(x + i, y + j)] || {}).t)) n++; return n; };

  let sum = 0;
  for (const k in tiles) {
    const b = tiles[k]; if (b.o !== uid || !RENT[b.t]) continue;
    const [x, y] = k.split("_").map(Number);
    if (nearRoad(x, y)) sum += RENT[b.t] * (1 + Math.min(3, nearType(x, y, 2, ["park"])) * 0.15);
  }

}
async function runBuilding(key, t) {      // produkcja/przetwórstwo jednego zakładu; zwraca przychód właściciela
  const r = RECIPE[t.t]; if (!r) return 0;
  const st = stock[key] || {};
  if (!r.in) { const n = await adjust(key, r.out, r.rate); return n * 1.5; }
  if (r.consume) {
    let inc = 0;
    for (const c of r.in) { const m = Math.min(st[c] || 0, r.rate); if (m > 0) { const got = -(await adjust(key, c, -m, 400)); inc += got * (r.sell[c] || 0); } }
    return inc;
  }
  if ((st[r.out] || 0) >= CAP - 5) return 0;

  for (const c of r.in) { const m = Math.min(st[c] || 0, r.rate - n); if (m > 0) { n += -(await adjust(key, c, -m, 400)); } }

}
let busy = false;
async function myTick() {
  if (!uid || busy) return; busy = true;
  try {
    const rent = rentIncome(); cash += rent; fin.rent += rent;
    for (const key in tiles) {
      const b = tiles[key]; if (b.o !== uid || !RECIPE[b.t]) continue;
      const inc = await runBuilding(key, b);

    }

}
function monthTick() {
  if (!uid) return;

  const g = gdate();

  if (g.mi <= monthTick.last) return;
  monthTick.last = g.mi;
  // koszty utrzymania pojazdów + odsetki
  let run = 0; const upd = {};
  for (const [id, v] of Object.entries(vehicles)) {
    if (v.o !== uid) continue;
    const c = runCost(v) / 12; run += c;
    let py = (v.py || 0) - c, pl = v.pl || 0;
    if (g.y !== (v.yr || g.y)) { pl = py + c; py = -c; }
    upd[`vehicles/${id}/py`] = Math.round(py); upd[`vehicles/${id}/pl`] = Math.round(pl); upd[`vehicles/${id}/yr`] = g.y;
  }
  if (Object.keys(upd).length) update(ref(db), upd).catch(() => {});
  const interest = loan * RATE / 12;
  cash -= run + interest; fin.run += run; fin.interest += interest;
  if (g.y !== monthTick.year) { monthTick.year = g.y; lastFin = { ...fin, y: g.y - 1 }; fin = newFin(); news(`Nowy rok ${g.y}! Podsumowanie roku ${g.y - 1} w oknie Finanse.`, "good"); }
  if (run + interest > 0) news(`${MON[g.m]} ${g.y}: utrzymanie pojazdów ${money(run)}, odsetki ${money(interest)}.`);
  savePlayer(true);
}
function companyValue() {
  let v = cash - loan;
  for (const veh of Object.values(vehicles)) if (veh.o === uid) v += vehValue(veh);
  for (const k in tiles) { const t = tiles[k]; if (t.o === uid && BUILD[t.t]) v += BUILD[t.t].cost * 0.5; }
  return v;
}

// ============================================================
// 9. HOST ŚWIATA: jeden klient (najniższe uid spośród aktywnych) symuluje
//    miasta i przemysł systemowy oraz zaludnia nowy świat.
// ============================================================

  seeding = true;

    const seed = Date.now();
    const r = await runTransaction(ref(db, "stock/_seed"), v => v ? undefined : seed);
    if (!r.committed) return;
    await update(ref(db, "tiles"), genWorld(seed));
    news("Powstał nowy świat: miasta i zakłady czekają na transport!", "good");
  } catch (e) { console.warn(e); } finally { seeding = false; }
}
function genWorld(seed) {
  const R = mulberry(seed % 2147483647), obj = {}, occ = k => tiles[k] || obj[k];
  const land = (x, y) => inMap(x, y) && terrain[y * N + x] !== 0;
  const names = TOWN_NAMES.slice(); for (let i = names.length - 1; i > 0; i--) { const j = R() * (i + 1) | 0; [names[i], names[j]] = [names[j], names[i]]; }

  const towns = getIdx().list.map(T => ({ x: T.x, y: T.y, n: T.n }));
  let made = 0;
  for (let tries = 0; tries < 600 && made < 7; tries++) {
    const x = 10 + Math.floor(R() * (N - 20)), y = 10 + Math.floor(R() * (N - 20));
    if (!land(x, y) || occ(K(x, y))) continue;
    let l = 0; for (let j = -5; j <= 5; j++) for (let i = -5; i <= 5; i++) if (land(x + i, y + j)) l++;
    if (l < 95) continue;
    if (towns.some(T => Math.hypot(T.x - x, T.y - y) < 24) || BUYERS.some(b => Math.hypot(b.x - x, b.y - y) < 14)) continue;
    const n = names.find(q => !used.has(q)) || "Miasto " + (towns.length + 1); used.add(n);
    towns.push({ x, y, n }); made++;
    const tk = K(x, y), ox = x - 1, oy = y - 1;
    obj[tk] = { t: "townhall", o: "town", n };
    const road = (rx, ry) => { if (land(rx, ry) && !occ(K(rx, ry))) obj[K(rx, ry)] = { t: "road", o: "town", tw: tk }; };
    for (let i = -5; i <= 9; i++) { road(ox + i, oy); road(ox, oy + i); }
    for (let i = 0; i <= 4; i++) { road(ox + 4, oy + i); road(ox + i, oy + 4); }
    for (let dy = -4; dy <= 8; dy++) for (let dx = -4; dx <= 8; dx++) {
      const hx = ox + dx, hy = oy + dy;
      if (mod(dx, 4) === 0 || mod(dy, 4) === 0 || Math.hypot(hx - x, hy - y) > 6) continue;
      if (land(hx, hy) && !occ(K(hx, hy)) && R() < .6) obj[K(hx, hy)] = { t: R() < .18 ? "flat" : "house", o: "town", tw: tk };

    let placed = 0;
    for (let tries = 0; tries < 500 && placed < count; tries++) {
      const x = 5 + Math.floor(R() * (N - 10)), y = 5 + Math.floor(R() * (N - 10)), ter = terrain[y * N + x];

      obj[K(x, y)] = { t: type, o: "sys", n: BUILD[type].name + " " + (tn ? tn.n : "") };

}
let hostN = 0, hostBusy = false;
async function hostTick() {
  if (!uid || !stockLoaded || hostBusy) return;
  if (!amHost()) return;
  if (!stock._seed) return trySeed();
  hostBusy = true; hostN++;
  try {
    const I = getIdx();
    for (const T of I.list) {                                   // miasta: pasażerowie, poczta, rozwój
      const tk = "T_" + T.k;

        await adjust(tk, "pass", Math.ceil(T.pop / 10), Math.max(80, T.pop * 2));
        await adjust(tk, "mail", Math.ceil(T.pop / 40), Math.max(30, T.pop));

    }

async function growTown(T) {
  const st = stock["T_" + T.k] || {};
  const chance = .18 + Math.min(.35, (st.sv || 0) / 150) + Math.min(.25, (st.g || 0) / 60) + Math.min(.25, (st.f || 0) / 60);
  if (Math.random() > chance || !T.roads.length) return;
  const Rr = Math.min(26, 4 + Math.sqrt(T.pop) * .55), ox = T.x - 1, oy = T.y - 1;
  const [rx, ry] = xy(T.roads[Math.random() * T.roads.length | 0]);
  const [dx, dy] = DIRS[Math.random() * 4 | 0], nx = rx + dx, ny = ry + dy;

  const k = K(nx, ny), t = tiles[k], gx = mod(nx - ox, 4) === 0, gy = mod(ny - oy, 4) === 0;
  if (!t) {
    if ((dy === 0 && gy) || (dx === 0 && gx)) await set(ref(db, "tiles/" + k), { t: "road", o: "town", tw: T.k });
    else if (!gx && !gy) await set(ref(db, "tiles/" + k), { t: "house", o: "town", tw: T.k });
    return;
  }
  if (t.o !== "town") return;
  const dist = Math.hypot(nx - T.x, ny - T.y);
  if (t.t === "house" && T.pop > 120 && dist < Rr * .65 && Math.random() < .35) await set(ref(db, "tiles/" + k), { ...t, t: "flat" });
  else if (t.t === "flat" && T.pop > 450 && dist < Rr * .4 && Math.random() < .25) await set(ref(db, "tiles/" + k), { ...t, t: "tower" });
}

// 10. POJAZDY: trasy (BFS), wspólny zegar ruchu, załadunek i rozładunek
// ============================================================
function railOpen(x, y, d) {

  if (t.t === "station" || t.t === "buyer") return true;
  if (t.t !== "rail" && t.t !== "xing") return false;
  if (t.m == null) { const n = tiles[K(x + DIRS[d][0], y + DIRS[d][1])]; return !!n && RAILSET.has(n.t); }
  return !!(t.m & BIT[d]);
}
function canStep(kind, x, y, nx, ny, d) {
  const t = tiles[K(nx, ny)];
  if (kind === "road") return !!t && ROADSET.has(t.t) && !(t.t === "rail");
  if (kind === "rail") return !!t && RAILSET.has(t.t) && railOpen(x, y, d) && railOpen(nx, ny, OPP[d]);
  if (t && t.t === "dock") return true;
  return terrain[ny * N + nx] === 0 && (!t || !!t.b);

      const nk = K(nx, ny); if (prev.has(nk) || !canStep(kind, x, y, nx, ny, d)) continue;

const wagonsOf = v => VEH[v.k] && VEH[v.k].kind === "rail" ? (v.w || "ff") : "";

  if (m.kind !== "rail") return { p: 0, m: 0, f: 0, ...m.cap };

  for (const [id, v] of Object.entries(vehicles)) { const s = vstate(id, v, ts); if (s) { const p = carPos(s, 0); mctx.fillRect(p.x | 0, p.y | 0, 1, 1); } }
  const a = toTile(0, 0), b = toTile(innerWidth, 0), c = toTile(innerWidth, innerHeight), d = toTile(0, innerHeight);
  mctx.strokeStyle = "#fff"; mctx.lineWidth = .8; mctx.beginPath(); mctx.moveTo(a.x, a.y); mctx.lineTo(b.x, b.y); mctx.lineTo(c.x, c.y); mctx.lineTo(d.x, d.y); mctx.closePath(); mctx.stroke();
}, 600);
mini.onclick = e => { const r = mini.getBoundingClientRect(); jumpTo((e.clientX - r.left) / r.width * N, (e.clientY - r.top) / r.height * N); };
function jumpTo(x, y) { follow = null; const s = toScreen(x, y); cam.x = innerWidth / 2 - s.x * cam.z; cam.y = innerHeight / 2 - s.y * cam.z; }
function jumpHome() {
  const mineT = Object.keys(tiles).find(k => tiles[k].o === uid && RAD[tiles[k].t]);
  const T0 = getIdx().list.slice().sort((a, b) => b.pop - a.pop)[0];
  if (mineT) { const [x, y] = xy(mineT); jumpTo(x, y); } else if (T0) jumpTo(T0.x, T0.y);
}

// ============================================================
// 14. STEROWANIE (mysz / dotyk / klawiatura)
// ============================================================
let drag = null; const pts = new Map(); let pinch = null;
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z, cx: cam.x, cy: cam.y, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; drag = null; preview = null; return; }
  const t = toTile(e.clientX, e.clientY);
  const pan = e.button === 2 || e.button === 1 || tool === "info" || tool === "route" || (!["road", "rail", "bulldoze"].includes(tool));
  drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false, pan, start: t };
});
canvas.addEventListener("pointermove", e => {
  if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const z = Math.max(.25, Math.min(2.5, pinch.z * d / pinch.d));
    cam.z = z; cam.x = mx - (pinch.mx - pinch.cx) * z / pinch.z; cam.y = my - (pinch.my - pinch.cy) * z / pinch.z; return;
  }
  hover = toTile(e.clientX, e.clientY);
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
  if (!drag.moved) return;
  if (drag.pan) { follow = null; cam.x = drag.cx + dx; cam.y = drag.cy + dy; }
  else {
    const plan = tool === "bulldoze" ? planArea(drag.start, hover) : planLine(tool, drag.start, hover);
    preview = { plan, cost: plan.reduce((a, p) => a + p.cost, 0), end: hover };
  }
});
canvas.addEventListener("pointerup", e => {
  pts.delete(e.pointerId);
  if (pinch) { if (pts.size < 2) pinch = null; drag = null; return; }
  if (!drag) return;
  const t = toTile(e.clientX, e.clientY);
  if (!drag.moved && e.button === 0) act(t.x, t.y);
  else if (drag.moved && !drag.pan && preview) execPlan(preview.plan, tool === "bulldoze" ? "Wyburzono" : `Zbudowano ${BUILD[tool].name.toLowerCase()}`);
  drag = null; preview = null;
});
canvas.addEventListener("pointerleave", () => { hover = null; });
canvas.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1 / 1.12); }, { passive: false });
function zoomAt(px, py, f) { const old = cam.z; cam.z = Math.max(0.25, Math.min(2.5, cam.z * f)); cam.x = px - (px - cam.x) * cam.z / old; cam.y = py - (py - cam.y) * cam.z / old; }
function act(x, y) {
  if (!inMap(x, y)) return;
  const k = K(x, y), t = tiles[k];
  if (tool === "info") { openWin("tile", k); return; }
  if (tool === "route") {
    const kind = VEH[buy.k].kind;
    if (!t || !STOPS_FOR[kind].includes(t.t)) return say(`Kliknij ${kind === "road" ? "przystanek, dworzec lub skup" : kind === "rail" ? "dworzec lub skup" : "port"}.`, "bad");
    if (t.o !== uid && t.o !== "sys") return say("To stacja innej firmy – możesz korzystać tylko ze swoich (i skupów).", "bad");
    if (buy.st[buy.st.length - 1] === k) return;
    buy.st.push(k); renderWin(); return;
  }
  if (tool === "bulldoze") return execPlan(planArea({ x, y }, { x, y }), "Wyburzono");
  if (tool === "road" || tool === "rail") return execPlan(planLine(tool, { x, y }, { x, y }), `Zbudowano ${BUILD[tool].name.toLowerCase()}`);
  const r = planSingle(tool, x, y);
  if (r.err) return say(r.err, "bad");
  execPlan(r.plan, `Zbudowano: ${BUILD[tool].name}`);
  if (tool === "townhall") { news(`🏰 ${myName} założył(a) nowe miasto: ${r.plan[0].v.n}!`, "good"); setTool("info"); }
}
const keys = {};
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "`") return;
  keys[e.key.toLowerCase()] = true;
  if (e.key === "Shift") { flipL = !flipL; if (drag && !drag.pan && preview && hover) { const plan = tool === "bulldoze" ? planArea(drag.start, hover) : planLine(tool, drag.start, hover); preview = { plan, cost: plan.reduce((a, p) => a + p.cost, 0), end: hover }; } }
  if (e.key === "Escape") { if (win === "buy") closeWin(); setTool("info"); catOpen = null; renderPal(); preview = null; drag = null; }
  if (e.key === "+" || e.key === "=") zoomAt(innerWidth / 2, innerHeight / 2, 1.15);
  if (e.key === "-") zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.15);
});
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
function panKeys() {
  const s = 14; let dx = 0, dy = 0;
  if (keys.a || keys.arrowleft) dx += s; if (keys.d || keys.arrowright) dx -= s; if (keys.w || keys.arrowup) dy += s; if (keys.s || keys.arrowdown) dy -= s;
  if (dx || dy) { follow = null; cam.x += dx; cam.y += dy; }
}

// ============================================================
// 15. KONSOLA (klawisz `)
// ============================================================
const con = $("con"), out = $("out"), inp = $("in");
const log = t => { out.textContent += t + "\n"; out.scrollTop = out.scrollHeight; };
addEventListener("keydown", e => {
  if (e.key === "`") {
    e.preventDefault();
    const open = con.style.display === "flex";
    con.style.display = open ? "none" : "flex";
    if (!open) { inp.focus(); if (!out.textContent) log("Konsola. Wpisz 'help'."); }
  }
});
inp.addEventListener("keydown", async e => {
  if (e.key !== "Enter") return;
  const line = inp.value.trim(); inp.value = "";
  if (!line) return;
  log("> " + line.replace(/^(login \S+ ).*/, "$1***"));
  const [cmd, ...args] = line.split(/\s+/);
  switch (cmd) {
    case "help": log("login <użytkownik> <hasło>  – logowanie admina\nlogout\nreset   – (admin) czyści całą mapę\nseed    – (admin) ponownie zaludnia świat\ngive <ile>  – (admin) dodaje gotówkę\nname <nazwa> – zmiana nazwy firmy\nwho     – status"); break;
    case "login": if (args[0] === "admin" && args[1] === "admin") { isAdmin = true; log("Zalogowano jako admin."); } else log("Błędne dane."); break;
    case "logout": isAdmin = false; log("Wylogowano."); break;
    case "who": log((isAdmin ? "admin" : "gracz ") + myName + (amHost() ? " (host świata)" : "") + " · data " + JSON.stringify(gdate())); break;
    case "name": if (args.length) { myName = args.join(" ").slice(0, 24); localStorage.setItem("cityName", myName); $("name").textContent = myName; savePlayer(); log("Zmieniono nazwę."); } break;
    case "give": if (!isAdmin) return log("Brak uprawnień. Użyj: login admin admin"); cash += Number(args[0]) || 0; savePlayer(); log("Dodano gotówkę."); break;
    case "seed": if (!isAdmin) return log("Brak uprawnień."); await remove(ref(db, "stock/_seed")); log("Host zaludni świat w ciągu kilku sekund."); break;
    case "reset":
      if (!isAdmin) return log("Brak uprawnień. Użyj: login admin admin");
      await remove(ref(db, "tiles")); await remove(ref(db, "stock")); await remove(ref(db, "vehicles"));
      await set(ref(db, "resetAt"), Date.now());
      log("Mapa zresetowana. Host za chwilę zaludni nowy świat.");
      break;
    default: log("Nieznana komenda. Wpisz 'help'.");
  }
});

function findLand() {
  for (let r = 0; r < N / 2; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { const x = N / 2 + dx, y = N / 2 + dy; if (terrain[y * N + x] === 1) return { x, y }; }
  return { x: N / 2, y: N / 2 };
}
{ const l = findLand(); jumpTo(l.x, l.y); }
buildTools();
requestAnimationFrame(draw);
if (location.search.includes("debug")) window.__dbg = { tiles, cam, toScreen, getIdx, act: (t, x, y) => { setTool(t); act(x, y); }, line: (t, a, b) => execPlan(planLine(t, a, b)), st: () => ({ cash, loan, uid, host: amHost(), vehicles, stock, date: gdate() }), buy, doBuy, openWin, setTool };
init().catch(err => { say("Błąd Firebase: " + err.message, "bad"); console.error(err); $("load") && ($("load").style.opacity = 0, setTimeout(() => $("load") && $("load").remove(), 600)); });
