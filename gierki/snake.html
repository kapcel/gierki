<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake Multiplayer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1f3a;--panel:#252a4d;--line:#3a4072;--tx:#eef0ff;--mut:#9aa1d1;--ac:#ffd166;--b1:#12313a;--b2:#143a45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 'Space Grotesk',system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:1000px;padding:20px}
h1{margin:0 0 18px;font-size:30px;font-weight:700}
h1 em{font-style:normal;color:var(--ac)}
h2{margin:0 0 12px;font-size:19px} h3{margin:0 0 10px;font-size:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.mut{color:var(--mut)} small{color:var(--mut)}
label{display:block;margin-bottom:10px;color:var(--mut);font-size:13px}
input,select{display:block;width:100%;margin-top:4px;padding:9px 10px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;font:inherit}
select:disabled{opacity:.6}
button{padding:9px 16px;background:var(--line);color:var(--tx);border:0;border-radius:6px;font:inherit;font-weight:600;cursor:pointer}
button:hover:not(:disabled){filter:brightness(1.2)} button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--ac);color:#2a2200;width:100%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.set{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
#v-room .set{grid-template-columns:1fr}
.room{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.room:first-child{border-top:0}
.room button{width:auto;flex-shrink:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h2{margin:0}
.grid{display:grid;grid-template-columns:auto 270px;gap:16px;align-items:start;justify-content:center}
.wrap{position:relative;line-height:0}
canvas{border-radius:8px;border:2px solid var(--line);background:var(--b1);max-width:100%}
#ov{position:absolute;inset:2px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(18,20,40,.62);border-radius:6px;font-size:21px;font-weight:700;line-height:1.35;white-space:pre-line;pointer-events:none}
#ov:empty{display:none}
.pl{display:flex;align-items:center;gap:8px;padding:5px 0}
.dot{width:14px;height:14px;border-radius:4px;flex-shrink:0}
.pl .sc{margin-left:auto;font-weight:700}
.pl.dead{opacity:.45;text-decoration:line-through}
@media(max-width:840px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Snake <em>Multiplayer</em></h1>
<div id="err" class="card" hidden>Uzupełnij <code>firebaseConfig</code> na początku skryptu w tym pliku (szczegóły w instrukcji).</div>

<section id="v-lobby">
  <div class="card"><label>Twój nick<input id="nick" maxlength="14" placeholder="np. Kobra"></label></div>
  <div class="card">
    <h2>Nowy pokój</h2>
    <label>Nazwa pokoju<input id="rname" maxlength="30" placeholder="np. Pokój Kobry"></label>
    <div id="cset" class="set"></div>
    <button id="bcreate" class="pri">Utwórz pokój</button>
  </div>
  <div class="card"><h2>Publiczne pokoje</h2><div id="rooms"></div></div>
</section>

<section id="v-room" hidden>
  <div class="top"><h2 id="rtitle"></h2><button id="bleave">Wyjdź z pokoju</button></div>
  <div class="grid">
    <div class="wrap"><canvas id="cv"></canvas><div id="ov"></div></div>
    <aside>
      <div class="card"><h3>Gracze</h3><div id="plist"></div></div>
      <div class="card"><h3>Ustawienia gry</h3><div id="rset" class="set"></div></div>
      <button id="bstart" class="pri">Start</button>
      <p class="mut">Sterowanie: strzałki lub WASD</p>
    </aside>
  </div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ====== 1. WKLEJ TUTAJ KONFIGURACJĘ SWOJEGO PROJEKTU FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyCakFB1pPSafuCnlYBXVqVzu3rT4FHM6wE",
  authDomain: "snake-3e82f.firebaseapp.com",
  databaseURL: "https://snake-3e82f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "snake-3e82f",
  storageBucket: "snake-3e82f.firebasestorage.app",
  messagingSenderId: "759360530677",
  appId: "1:759360530677:web:aaeed07894bec17c997dbc",
  measurementId: "G-3G6B5ME314"
};
// ====================================================================

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const COLORS = ['#ffd166', '#ff5d73', '#4cc9f0', '#80ed99', '#c77dff', '#ff9f1c', '#f15bb5', '#e9ecef'];
const MAXP = 8, DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0]; // 0=góra 1=prawo 2=dół 3=lewo
const pid = Math.random().toString(36).slice(2, 10);

// Ustawienia: [klucz, etykieta, opcje, wartość domyślna]
const SET = [
  ['size', 'Wielkość pola', [[12, '12 × 12 – mała'], [16, '16 × 16'], [20, '20 × 20 – średnia'], [30, '30 × 30 – duża'], [40, '40 × 40 – ogromna']], 20],
  ['mode', 'Warunek wygranej', [['all', 'Do końca – wygrywa najwięcej punktów'], ['last', 'Last man standing – ostatni żywy']], 'all'],
  ['walls', 'Ściany', [['solid', 'Zabijają'], ['wrap', 'Przenikalne']], 'solid'],
  ['food', 'Liczba owoców', [[0, 'Auto – tyle co graczy'], [1, '1'], [3, '3'], [5, '5'], [10, '10'], [20, '20']], 0],
  ['speed', 'Tempo', [[200, 'Wolne'], [130, 'Normalne'], [80, 'Szybkie']], 130]
];
function buildSet(box, onchange) {
  box.innerHTML = '';
  SET.forEach(([k, l, o, d]) => {
    const lab = document.createElement('label'); lab.textContent = l;
    const s = document.createElement('select'); s.dataset.k = k;
    o.forEach(([v, t]) => s.add(new Option(t, v)));
    s.value = d;
    s.onchange = () => { s.blur(); onchange && onchange(k, typeof d === 'number' ? +s.value : s.value); };
    lab.appendChild(s); box.appendChild(lab);
  });
}
function getSet(box) {
  const r = {};
  box.querySelectorAll('select').forEach(s => {
    const d = SET.find(x => x[0] === s.dataset.k)[3];
    r[s.dataset.k] = typeof d === 'number' ? +s.value : s.value;
  });
  return r;
}

let db, room = null, meta = null, players = {}, st = null, unsubs = [];
let hostTimer = null, hostTO = null, game = null, queues = {}, lastSent = null;
let hostW = null, model = null, buf = [], nextAt = 0, curAt = 0, ivUsed = 130, pre = true, arrivedAt = 0;
const isHost = () => !!meta && meta.host === pid;
const show = v => { $('v-lobby').hidden = v !== 'lobby'; $('v-room').hidden = v !== 'room'; };
const myName = () => {
  const n = $('nick').value.trim().slice(0, 14) || 'Gracz' + Math.floor(Math.random() * 100);
  try { localStorage.setItem('snake-nick', n); } catch (e) {}
  return n;
};

// ---------- LOBBY ----------
function watchLobby() {
  db.ref('rooms').on('value', s => {
    const v = s.val() || {}, el = $('rooms'); el.innerHTML = '';
    const ids = Object.keys(v).filter(id => v[id].meta);
    if (!ids.length) { el.innerHTML = '<p class="mut">Brak pokoi. Utwórz pierwszy i zaproś znajomych.</p>'; return; }
    ids.forEach(id => {
      const m = v[id].meta, n = Object.keys(v[id].players || {}).length;
      const open = m.status === 'lobby' && n < MAXP;
      const d = document.createElement('div'); d.className = 'room';
      d.innerHTML = `<div><b>${esc(m.name)}</b><br><small>Pole ${m.size}×${m.size}, ${m.mode === 'last' ? 'ostatni żywy' : 'do końca'}, graczy ${n}/${MAXP}${m.status === 'playing' ? ', trwa gra' : ''}</small></div>`;
      const b = document.createElement('button');
      b.textContent = open ? 'Dołącz' : (m.status === 'playing' ? 'W grze' : 'Pełny');
      b.disabled = !open; b.onclick = () => joinRoom(id);
      d.appendChild(b); el.appendChild(d);
    });
  });
}

function createRoom() {
  const id = db.ref('rooms').push().key;
  const m = Object.assign({ name: ($('rname').value.trim() || myName() + ' – pokój').slice(0, 30), host: pid, status: 'lobby' }, getSet($('cset')));
  db.ref('rooms/' + id + '/meta').set(m).then(() => {
    db.ref('rooms/' + id).onDisconnect().remove();
    db.ref('states/' + id).onDisconnect().remove();
    db.ref('inputs/' + id).onDisconnect().remove();
    enter(id, true);
  }).catch(e => alert('Błąd Firebase: ' + e.message));
}

function joinRoom(id) {
  db.ref('rooms/' + id).once('value').then(s => {
    const v = s.val();
    if (!v || !v.meta || v.meta.status !== 'lobby' || Object.keys(v.players || {}).length >= MAXP) return alert('Nie można dołączyć do tego pokoju.');
    enter(id, false);
  });
}

function on(ref, cb) { ref.on('value', cb); unsubs.push(() => ref.off('value', cb)); }

function enter(id, host) {
  room = id; meta = null; st = null; players = {}; show('room');
  const R = db.ref('rooms/' + id);
  on(R.child('meta'), s => {
    const m = s.val();
    if (!m) { if (room) { alert('Pokój został zamknięty.'); cleanup(); } return; }
    meta = m; renderRoom();
  });
  on(R.child('players'), s => { players = s.val() || {}; renderRoom(); });
  on(db.ref('states/' + id), s => { if (s.val()) onMsg(JSON.parse(s.val())); });
  if (host) {
    const ir = db.ref('inputs/' + id);
    const cb = ir.on('child_added', s => { const v = s.val(); if (v) pushDir(v.p, v.d); });
    unsubs.push(() => ir.off('child_added', cb));
  }
  R.child('players').once('value').then(s => {
    const used = Object.values(s.val() || {}).map(p => p.c);
    let c = 0; while (used.includes(c)) c++;
    const me = R.child('players/' + pid);
    me.onDisconnect().remove();
    me.set({ n: myName(), c: c % COLORS.length });
  });
}

function cleanup() {
  unsubs.forEach(f => f()); unsubs = [];
  clearInterval(hostTimer); clearTimeout(hostTO);
  stopClock();
  room = meta = st = game = model = null; players = {}; queues = {}; lastSent = null; buf = []; pre = true; nextAt = 0;
  show('lobby');
}
function leave() {
  if (!room) return;
  const id = room, host = isHost();
  cleanup();
  if (host) { db.ref('rooms/' + id).remove(); db.ref('states/' + id).remove(); db.ref('inputs/' + id).remove(); }
  else db.ref(`rooms/${id}/players/${pid}`).remove();
}

// ---------- WIDOK POKOJU ----------
function renderRoom() {
  if (!meta) return;
  const host = isHost(), lobby = meta.status === 'lobby';
  $('rtitle').textContent = meta.name;
  $('rset').querySelectorAll('select').forEach(s => { s.value = meta[s.dataset.k]; s.disabled = !host || !lobby; });
  const pl = $('plist'); pl.innerHTML = '';
  Object.entries(players).forEach(([id, p]) => {
    const sn = st && st.s.find(x => x.id === id);
    const d = document.createElement('div'); d.className = 'pl' + (sn && !sn.a ? ' dead' : '');
    d.innerHTML = `<span class="dot" style="background:${COLORS[p.c]}"></span><span>${esc(p.n)}${id === meta.host ? ' (host)' : ''}${id === pid ? ' (Ty)' : ''}</span><span class="sc">${sn ? sn.sc : ''}</span>`;
    pl.appendChild(d);
  });
  const b = $('bstart');
  b.hidden = !host; b.disabled = !lobby;
  b.textContent = st && st.o ? 'Zagraj ponownie' : 'Start';
  let m = '';
  if (!st || (lobby && !st.o)) m = host ? 'Ustaw grę i naciśnij Start' : 'Czekaj, aż host rozpocznie grę';
  else if (st.t === 0 && !st.o) m = 'Przygotuj się…';
  else if (st.o) {
    const w = st.w;
    m = (w.length === 0 ? 'Nikt nie przeżył' : w.length === 1 ? 'Wygrywa ' + w[0] : 'Remis: ' + w.join(', ')) + (host ? '\nNaciśnij „Zagraj ponownie”' : '\nCzekaj na kolejną rundę');
  }
  $('ov').textContent = m;
}

// ---------- KLIENT: bufor opóźnień + płynna interpolacja ----------
const fromSnap = k => ({
  N: k.N, t: k.t, o: k.o, w: k.w, f: k.f,
  sn: Object.fromEntries(k.s.map(x => {
    const b = []; for (let i = 0; i < x.b.length; i += 2) b.push([x.b[i], x.b[i + 1]]);
    return [x.id, { id: x.id, n: x.n, c: x.c, a: x.a, sc: x.sc, b, ot: null, fade: null }];
  }))
});
function mkFrame() {
  const M = model;
  return {
    N: M.N, t: M.t, o: M.o, w: M.w, f: M.f.slice(),
    s: Object.values(M.sn).map(x => { const r = { id: x.id, n: x.n, c: x.c, a: x.a, sc: x.sc, b: x.b.slice(), ot: x.ot, fade: x.fade }; x.ot = null; x.fade = null; return r; })
  };
}
function applyDelta(d) {
  const M = model; M.t = d.t;
  d.m.forEach(([id, x, y, gr]) => {
    const x0 = M.sn[id]; if (!x0 || !x0.a) return;
    x0.b.unshift([x, y]);
    if (gr) x0.sc++; else x0.ot = x0.b.pop();
  });
  d.x.forEach(id => { const x0 = M.sn[id]; if (x0 && x0.a) { x0.fade = x0.b; x0.a = 0; x0.b = []; } });
  d.e.forEach(([x, y]) => { M.f = M.f.filter(f => f[0] !== x || f[1] !== y); });
  d.n.forEach(c => M.f.push(c));
  if (d.o) { M.o = 1; M.w = d.w; }
}
function onMsg(m) {
  const k = m.k;
  if (k && (!model || k.t === 0 || k.t < model.t)) { // nowa runda / pierwsze dane
    model = fromSnap(k); if (k.t === 0) lastSent = null;
    buf = []; pre = true; st = mkFrame(); renderRoom(); return;
  }
  if (!model) return;
  const dl = m.d.filter(d => d.t > model.t);
  if (!dl.length) return;
  if (dl[0].t !== model.t + 1) { // luka w danych – wróć do pełnego zrzutu
    if (k) { model = fromSnap(k); buf.push(mkFrame()); arrivedAt = performance.now(); }
    return;
  }
  dl.forEach(d => { applyDelta(d); buf.push(mkFrame()); });
  arrivedAt = performance.now();
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!room) return;
  const sp = (meta && meta.speed) || 130;
  if (buf.length) { // bez bufora: pokazuj najnowszą klatkę od razu, animacja kończy się przed następnym tickiem
    st = buf[buf.length - 1]; buf = [];
    curAt = now; ivUsed = sp * .7; renderRoom();
  }
  draw(now);
}
function draw(now) {
  const cv = $('cv'), ctx = cv.getContext('2d');
  const N = st ? st.N : (meta ? meta.size : 20);
  const cell = Math.max(8, Math.floor(Math.min(620, Math.min(innerWidth, 1000) - 40) / N)), px = N * cell;
  if (cv.width !== px) cv.width = cv.height = px;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    ctx.fillStyle = (x + y) % 2 ? '#12313a' : '#143a45';
    ctx.fillRect(x * cell, y * cell, cell, cell);
  }
  if (!st) return;
  const a = Math.min(1, (now - curAt) / ivUsed), g = Math.max(1, cell * .06), sz = cell - 2 * g;
  const L = (p, q) => Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) > 1 ? q : [p[0] + (q[0] - p[0]) * a, p[1] + (q[1] - p[1]) * a];
  ctx.fillStyle = '#ff6b6b';
  st.f.forEach(([x, y]) => { ctx.beginPath(); ctx.arc((x + .5) * cell, (y + .5) * cell, cell * .36, 0, 7); ctx.fill(); });
  st.s.forEach(s => {
    const col = COLORS[s.c];
    if (!s.a) {
      if (s.fade && a < 1) { ctx.fillStyle = col; ctx.globalAlpha = (1 - a) * .6; s.fade.forEach(p => ctx.fillRect(p[0] * cell + g, p[1] * cell + g, sz, sz)); ctx.globalAlpha = 1; }
      return;
    }
    const b = s.b, n = b.length;
    for (let i = n - 1; i >= 0; i--) { // segment i płynie z poprzedniej kratki do obecnej
      const p = L(i < n - 1 ? b[i + 1] : (s.ot || b[n - 1]), b[i]), X = p[0] * cell + g, Y = p[1] * cell + g;
      ctx.fillStyle = col; ctx.globalAlpha = i ? .82 : 1;
      ctx.fillRect(X, Y, sz, sz);
      if (!i) {
        ctx.globalAlpha = 1; ctx.fillStyle = '#1b1f3a';
        ctx.fillRect(X + cell * .29, Y + cell * .29, cell * .3, cell * .3);
        if (s.id === pid) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(X, Y, sz, sz); }
      }
    }
    ctx.globalAlpha = 1;
  });
}
requestAnimationFrame(frame);

// ---------- STEROWANIE ----------
function pushDir(p, d) { const q = queues[p] || (queues[p] = []); if (q.length < 3) q.push(d); }
function sendDir(k) {
  if (k === lastSent) return;
  lastSent = k;
  if (isHost()) pushDir(pid, k); else db.ref('inputs/' + room).push({ p: pid, d: k });
}
const KEYS = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3, W: 0, D: 1, S: 2, A: 3 };
addEventListener('keydown', e => {
  const k = KEYS[e.key];
  if (k === undefined || !room || e.target.tagName === 'INPUT') return;
  e.preventDefault();
  sendDir(k);
});
let tx = 0, ty = 0;
addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
addEventListener('touchend', e => {
  if (!room) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
  const k = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
  sendDir(k);
});

// ---------- SILNIK GRY (działa tylko u hosta) ----------
function startClock(ms) { stopClock(); hostTimer = setInterval(tick, ms); }
function stopClock() { if (hostW) { hostW.terminate(); hostW = null; } clearInterval(hostTimer); }

function startGame() {
  if (!isHost() || meta.status !== 'lobby') return;
  const ids = Object.keys(players), N = meta.size, n = ids.length;
  if (!n) return;
  const cnt = [Math.ceil(n / 2), Math.floor(n / 2)], sn = {};
  ids.forEach((id, i) => {
    const side = i % 2, k = (i - side) / 2, y = Math.floor((k + 1) * N / (cnt[side] + 1)), L = side === 0, body = [];
    for (let j = 0; j < 3; j++) body.push([L ? 3 - j : N - 4 + j, y]);
    sn[id] = { id, n: players[id].n, c: players[id].c, a: 1, sc: 0, b: body, d: L ? 1 : 3 };
  });
  game = { N, sn, food: [], fn: [], hist: [], tick: 0, over: 0, win: [] };
  for (let i = 0; i < foodTarget(); i++) spawnFood();
  queues = {};
  db.ref('inputs/' + room).remove();
  db.ref(`rooms/${room}/meta/status`).set('playing');
  publish();
  stopClock(); clearTimeout(hostTO);
  hostTO = setTimeout(() => startClock(meta.speed), 2500);
}

const foodTarget = () => meta.food > 0 ? meta.food : Math.max(1, Object.values(game.sn).filter(s => s.a).length);
function spawnFood() {
  const g = game, occ = new Set(), free = [];
  Object.values(g.sn).forEach(s => s.a && s.b.forEach(p => occ.add(p[0] * 100 + p[1])));
  g.food.forEach(p => occ.add(p[0] * 100 + p[1]));
  for (let y = 0; y < g.N; y++) for (let x = 0; x < g.N; x++) if (!occ.has(x * 100 + y)) free.push([x, y]);
  if (free.length) { const c = free[Math.random() * free.length | 0]; g.food.push(c); g.fn.push(c); }
}

function tick() {
  const g = game;
  if (!g || g.over) return;
  const N = g.N, wrap = meta.walls === 'wrap', mv = [], xs = [], fe = [];
  g.tick++; g.fn = [];
  Object.values(g.sn).filter(s => s.a).forEach(s => {
    if (!players[s.id]) { s.a = 0; s.b = []; xs.push(s.id); return; } // gracz wyszedł
    const q = queues[s.id];
    while (q && q.length) { const nd = q.shift(); if (nd !== s.d && nd !== (s.d + 2) % 4) { s.d = nd; break; } }
    let x = s.b[0][0] + DX[s.d], y = s.b[0][1] + DY[s.d];
    if (wrap) { x = (x + N) % N; y = (y + N) % N; }
    else if (x < 0 || y < 0 || x >= N || y >= N) { s.a = 0; s.b = []; xs.push(s.id); return; }
    s.b.unshift([x, y]);
    const fi = g.food.findIndex(f => f[0] === x && f[1] === y);
    let gr = 0;
    if (fi >= 0) { g.food.splice(fi, 1); s.sc++; gr = 1; fe.push([x, y]); } else s.b.pop();
    mv.push([s.id, x, y, gr]);
  });
  // kolizje: głowa w polu zajętym przez dowolny segment (swój lub cudzy)
  const live = Object.values(g.sn).filter(s => s.a), cells = new Map();
  live.forEach(s => s.b.forEach(p => { const k = p[0] * 100 + p[1]; cells.set(k, (cells.get(k) || 0) + 1); }));
  live.filter(s => cells.get(s.b[0][0] * 100 + s.b[0][1]) > 1).forEach(s => { s.a = 0; s.b = []; xs.push(s.id); });
  const left = Object.values(g.sn).filter(s => s.a);
  for (let i = g.food.length; i < foodTarget(); i++) spawnFood();
  const all = Object.values(g.sn);
  const end = meta.mode === 'last' && all.length > 1 ? left.length <= 1 : left.length === 0;
  if (end) {
    g.over = 1;
    if (meta.mode === 'last') g.win = left.map(s => s.n);
    else { const m = Math.max(...all.map(s => s.sc)); g.win = all.filter(s => s.sc === m).map(s => s.n); }
    stopClock();
  }
  publish({ t: g.tick, m: mv, x: xs, e: fe, n: g.fn, o: g.over, w: g.win });
  if (end) db.ref(`rooms/${room}/meta/status`).set('lobby');
}

// Wysyłamy tylko ostatnie 4 małe delty (+ co 10 ticków pełny zrzut) zamiast całego stanu
function publish(d) {
  const g = game;
  if (d) { g.hist.push(d); if (g.hist.length > 4) g.hist.shift(); }
  const msg = { d: g.hist };
  if (!d || g.over || g.tick % 10 === 0) msg.k = {
    N: g.N, t: g.tick, o: g.over, w: g.win, f: g.food,
    s: Object.values(g.sn).map(s => ({ id: s.id, n: s.n, c: s.c, a: s.a, sc: s.sc, b: s.b.flat() }))
  };
  db.ref('states/' + room).set(JSON.stringify(msg));
}

// ---------- START ----------
buildSet($('cset'));
buildSet($('rset'), (k, v) => { if (isHost() && meta.status === 'lobby') db.ref(`rooms/${room}/meta/${k}`).set(v); });
try { $('nick').value = localStorage.getItem('snake-nick') || ''; } catch (e) {}
$('bcreate').onclick = createRoom;
$('bleave').onclick = leave;
$('bstart').onclick = e => { e.target.blur(); startGame(); };
addEventListener('beforeunload', () => { if (room && isHost() && game) clearInterval(hostTimer); });
if (firebaseConfig.databaseURL.includes('TWOJ')) $('err').hidden = false;
else { firebase.initializeApp(firebaseConfig); db = firebase.database(); watchLobby(); }
</script>
